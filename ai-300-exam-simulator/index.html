Connector for Azure authentication.\n- Prevent production secrets from being available before reviewer approval.\n\nHow should you complete the workflow? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.\n\n```yaml\nname: deploy-prod-ml-infra\n\non:\n  push:\n    branches: [ main ]\n    paths:\n      - infra/**\n\npermissions:\n  contents: read\n  [BLANK 1] : write\n\njobs:\n  deploy:\n    runs-on: ubuntu-latest\n    [BLANK 2] : prod\n    steps:\n      - uses: actions/checkout@v4\n      - uses: azure/login@v2\n        with:\n          client-id: ${{ secrets.AZURE_CLIENT_ID }}\n          tenant-id: ${{ secrets.AZURE_TENANT_ID }}\n          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}\n      - run: az deployment group create --resource-group prod-ml-rg --template-file infra/main.bicep\n```", "opts": [], "correct": [], "answer": "- First dropdown: id-token (`id-token: write`)\n- Second dropdown: environment (`environment: prod`)", "rationale": "Setting id-token to write allows the workflow to request an OpenID Connect token for Azure authentication, and setting the job-level key to environment: prod associates the job with the protected environment so the production environment secrets are unavailable until reviewer approval. The contents permission is used for repository content access, and deployments is used for deployment-related API access; neither enables OIDC token issuance. Using env defines environment variables, concurrency controls simultaneous workflow runs, and permissions controls token permissions; none of those options applies the protected environment or gates access to environment secrets.", "hint": "id-token: write lets the job get an OIDC token. environment: prod holds secrets until approval.", "note": "the platform showed the correct selections. Only the choices named in its explanation were captured for each dropdown. The dropdown choices were captured from the platform's explanation, so the real lists may have had more entries.", "slots": [{"label": "Blank 1 (before ': write' under permissions)", "correct": "id-token", "choices": ["contents", "deployments", "id-token"]}, {"label": "Blank 2 (job key before ': prod')", "correct": "environment", "choices": ["concurrency", "env", "environment", "permissions"]}]}, {"n": 49, "dom": 2, "type": "mc", "stem": "You are working on a deep learning (DL) project.\n\nYou plan to create a pipeline to process data and then train the DL model.\n\nYou need to recommend where to import the pipeline class.\n\nWhat should you recommend?", "opts": [["A", "azure.ai.ml.dsl"], ["B", "azure.ai"], ["C", "azure.ai.ml"], ["D", "azure.pipeline"]], "correct": ["A"], "answer": "A. azure.ai.ml.dsl", "rationale": "", "hint": "The pipeline decorator lives in the dsl module.", "note": ""}, {"n": 50, "dom": 1, "type": "mc", "stem": "A company hires you to lead a team of data scientists.\n\nYou need to create a custom environment to increase collaboration within the team by using Azure CLI v2.\n\nWhich command should you use?", "opts": [["A", "az ml environment create"], ["B", "ml_client.environments.create_or_update"], ["C", "az ml environment show"], ["D", "az ml environment update"]], "correct": ["A"], "answer": "A. az ml environment create", "rationale": "", "hint": "Creating a custom environment from the CLI v2 uses az ml environment.", "note": ""}, {"n": 51, "dom": 1, "type": "mc", "stem": "You need to stop a compute instance every day with the least amount of effort.\n\nWhat should you do?", "opts": [["A", "Use Azure Machine Learning studio to stop the compute instance."], ["B", "Create a script that uses the Azure Machine Learning SDK for Python. Schedule the script to run."], ["C", "Set up a schedule in Azure Machine Learning studio and include a shutdown time."], ["D", "Set the autoscale of the compute instance to 0."]], "correct": ["C"], "answer": "C. Set up a schedule in Azure Machine Learning studio and include a shutdown time.", "rationale": "", "hint": "A recurring stop on a compute instance is a schedule, with a cron expression.", "note": ""}, {"n": 52, "dom": 1, "type": "mc", "stem": "You write a model training script. You plan to use the script in a run in Azure Machine Learning.\n\nYou need to load all records from a dataset into a pandas dataframe.\n\nWhich code segment should you add to the script?", "opts": [["A", "`tabular_data = data.to_pandas_dataframe()`"], ["B", "`tabular_data = data.get()`"], ["C", "`tabular_data = data.to_spark_dataframe()`"], ["D", "`tabular_data = data.sample()`"]], "correct": ["A"], "answer": "A. `tabular_data = data.to_pandas_dataframe()`", "rationale": "This item tests the candidate’s knowledge of loading data into a run in Azure Machine Learning.\n\nThe to_pandas_dataframe method loads the tabular dataset as a pandas dataframe. The get method of the Dataset class returns a references Dataset from the Azure Machine Learning workspace. The to_spark_dataframe method loads the tabular dataset as a spark dataframe. The data.sample method generates a sample from the tabular dataset.", "hint": "A tabular data asset converts to pandas with a dedicated method.", "note": ""}, {"n": 53, "dom": 1, "type": "multi", "stem": "You have an Azure Machine Learning workspace named Workspace1. The workspace has a private endpoint.\n\nTraining jobs must download packages from pypi.org and access the blob service of an approved storage account named Storage1. Storage1 supports private endpoint connections.\n\nYou plan to disable public access to Workspace1 and set the managed network to allow only approved outbound traffic.\n\nYou need to configure outbound rules. The solution must minimize data exfiltration risk.\n\nWhich two outbound rules should you configure? Each correct answer presents part of the solution.\n\nNOTE: Each correct selection is worth one point.", "opts": [["A", "A service tag rule for AzureFrontDoor.FrontEnd over TCP 443."], ["B", "A private endpoint rule for the file subresource of Storage1."], ["C", "A service tag rule for Storage.<region> over TCP 443."], ["D", "An FQDN rule for pypi.org."], ["E", "A private endpoint rule for the blob subresource of Storage1."], ["F", "An FQDN rule for *.blob.core.windows.net."]], "correct": ["D", "E"], "answer": "D. An FQDN rule for pypi.org. and E. A private endpoint rule for the blob subresource of Storage1.", "rationale": "", "hint": "Under AllowOnlyApprovedOutbound: FQDN for a public hostname, private endpoint for private access.", "note": ""}, {"n": 54, "dom": 1, "type": "mc", "stem": "You plan to create a new Azure Machine Learning Workspace.\n\nYou need to use a custom data encryption key for enhanced data security based on the following considerations:\n\n- Azure Cosmos DB provider is registered\n- Azure Key Vault is created and configured\n- A custom data encryption key is generated\n- Azure Python ML SDK v2 must be used\n\nWhat should you do?", "opts": [["A", "```\nfrom azure.ai.ml.entities import Workspace, CustomerManagedKey\nws = Workspace(\n    location=\"eastus\",\n    display_name=\"My workspace\",\n    description=\"This example shows how to create a workspace\",\n    customer_managed_key=CustomerManagedKey(\n        key_vault=\"/subscriptions/<SUBSCRIPTION_ID>/resourcegroups/<RESOURCE_GROUP>/providers/microsoft.keyvault/vaults/<VAULT_NAME>\"\n        key_uri=\"<KEY-IDENTIFIER>\"\n    )\n    tags=dict(purpose=\"DP-100 Exam\")\n)\nml_client.workspaces.begin_create(ws)\n```"], ["B", "```\nfrom azure.ai.ml.entities import Workspace, CustomerManagedKey\nws = Workspace(\n    name=\"my_workspace\",\n    location=\"eastus\",\n    display_name=\"My workspace\",\n    description=\"This example shows how to create a workspace\",\n    customer_managed_key=CustomerManagedKey(\n        key_vault=\"/subscriptions/<SUBSCRIPTION_ID>/resourcegroups/<RESOURCE_GROUP>/providers/microsoft.keyvault/vaults/<VAULT_NAME>\"\n        key_uri=\"<KEY-IDENTIFIER>\"\n    )\n    tags=dict(purpose=\"DP-100 Exam\")\n)\n```"], ["C", "```\nfrom azure.ai.ml.entities import Workspace, CustomerManagedKey\nws = Workspace(\n    name=\"my_workspace\",\n    location=\"eastus\",\n    display_name=\"My workspace\",\n    description=\"This example shows how to create a workspace\",\n    customer_managed_key=CustomerManagedKey(\n        key_vault=\"/subscriptions/<SUBSCRIPTION_ID>/resourcegroups/<RESOURCE_GROUP>/providers/microsoft.keyvault/vaults/<VAULT_NAME>\"\n        key_uri=\"<KEY-IDENTIFIER>\"\n    )\n    tags=dict(purpose=\"DP-100 Exam\")\n)\nml_client.workspaces.begin_create(ws)\n```"], ["D", "```\nfrom azure.ai.ml.entities import Workspace, CustomerManagedKey\nws = Workspace(\n    name=\"my_workspace\",\n    location=\"eastus\",\n    display_name=\"My workspace\",\n    description=\"This example shows how to create a workspace\",\n    customer_managed_key=CustomerManagedKey(\n        key_uri=\"<KEY-IDENTIFIER>\"\n    )\n    tags=dict(purpose=\"DP-100 Exam\")\n)\nml_client.workspaces.begin_create(ws)\n```"]], "correct": ["C"], "answer": "C (the only option with the name, both key_vault and key_uri, and the begin_create call)", "rationale": "This item tests the candidate’s knowledge of managing the Azure Machine Learning workspace with respect to data security. To create a new Azure Machine Learning workspace and use an existing custom data encryption key, appropriate parameters need to be passed to the Workspace class, which are showcased in the correct answer.", "hint": "Customer-managed key: name, key_vault and key_uri, then create the workspace.", "note": ""}, {"n": 55, "dom": 1, "type": "mc", "stem": "You have an Azure Machine Learning workspace and a GitHub repository that contains training scripts. The repository uses main for production code and feature branches for updates.\n\nData scientists submit Azure Machine Learning CLI jobs from compute instances after copying files to ~/cloudfiles/code/manual.\n\nCompleted jobs do not include the repository URI, branch, or commit hash.\n\nYou need source traceability for future jobs. The solution must capture Git metadata automatically.\n\nWhat should you do?", "opts": [["A", "Install Git on each compute instance, and submit jobs from ~/cloudfiles/code/manual."], ["B", "Clone the repository on each compute instance, and submit jobs from the cloned directory."], ["C", "Add custom job tags for the repository URL, branch, and commit hash."], ["D", "Add the repository URL to the job YAML file."]], "correct": ["B"], "answer": "B. Clone the repository on each compute instance, and submit jobs from the cloned directory.", "rationale": "Cloning the repository and submitting jobs from the cloned directory provides the local Git context needed for Azure Machine Learning to automatically capture the repository URI, active branch, and commit hash. Installing Git alone is insufficient if the submitted files are still outside a Git repository. Adding custom job tags requires manual metadata entry, and adding only the repository URL to the job YAML file does not provide the active branch or commit context.", "hint": "Git metadata is captured automatically when the repo is cloned on the compute and the job is submitted from it.", "note": ""}, {"n": 56, "dom": 1, "type": "mc", "stem": "You have an Azure Machine Learning workspace.\n\nYou need to run a Python script that requires a fixed number of 16 CPUs. The script will run for 10 minutes and will NOT be reused.\n\nWhat should you use to run the script?", "opts": [["A", "a Machine Learning compute instance"], ["B", "Azure Container Instances"], ["C", "Azure Kubernetes Service (AKS)"], ["D", "Machine Learning compute clusters"]], "correct": ["B"], "answer": "B. Azure Container Instances", "rationale": "Since the script is a short-lived workload (10 minutes) that requires a fixed number of CPUs and will not be reused, Azure Container Instances (ACI) is the best fit. ACI provides on-demand, serverless containers that can be spun up quickly and shut down automatically, minimizing cost and overhead. A compute instance is intended for interactive development and only supports single-VM workloads, not 16 CPUs for batch runs. A compute cluster is designed for reusable, scalable training jobs, which introduces unnecessary overhead if the job won’t be reused. AKS is appropriate for high-scale, production-grade deployments, not for lightweight one-off batch jobs.", "hint": "Short, one-off, fixed size, not reused: follow this exam's key.", "note": "this is the platform's key. Compute clusters are the more common best practice for this kind of job, so treat it as an exam answer for \"short, fixed size, not reused\"."}, {"n": 57, "dom": 2, "type": "mc", "stem": "You train a model to predict housing prices based on house features.\n\nYou need to determine why the model made a prediction on a specific house in the dataset.\n\nWhich method should you use?", "opts": [["A", "Precision"], ["B", "Global feature importance"], ["C", "Gini coefficient"], ["D", "Local feature importance"]], "correct": ["D"], "answer": "D. Local feature importance", "rationale": "This item tests the candidate’s knowledge of model explainability concepts.\n\nThe Local feature importance method returns feature importance for a single example. The Precision method is a measure of model performance. The Global feature importance method returns feature importance for the entire dataset. The Gini coefficient method is a criterion used in Decision Tree Classifiers.", "hint": "Explain one prediction: local importance. Whole model: global.", "note": ""}, {"n": 58, "dom": 2, "type": "mc", "stem": "You have submitted a training job to Azure Machine Learning which has been completed.\n\nYou need to retrieve job metrics, artifacts, and parameters in a Jupyter Notebook by using the MLflowClient class in Azure ML Python SDK v2.\n\nWhich method should you use?", "opts": [["A", "`log_metric()`"], ["B", "`get_run()`"], ["C", "`update_run()`"], ["D", "`log_artifact()`"]], "correct": ["B"], "answer": "B. `get_run()`", "rationale": "", "hint": "MLflowClient retrieves runs, metrics, parameters and artifacts through a run object.", "note": ""}, {"n": 59, "dom": 2, "type": "mc", "stem": "You have an Azure Machine Learning project. You train a model to detect anomalies in purchase orders.\n\nYou need to ensure the model is fair when the age of the buyer is used as one of the features.\n\nWhat should you do?", "opts": [["A", "Analyze the selection rate of different cohorts."], ["B", "Analyze the recall of different cohorts."], ["C", "Analyze the global influencers."], ["D", "Enable Application Insights."]], "correct": ["B"], "answer": "B. Analyze the recall of different cohorts.", "rationale": "This item tests the candidate’s knowledge of evaluating model fairness based on prediction disparity.\n\nAnalyzing the recall of different cohorts will tell the prediction performance of the model and its fairness. Analyzing the selection rate will not tell the prediction performance of the model and its fairness. The global influencers will quantify the relative importance of each feature but not detect unfairness in the model. Application Insights is useful to collect telemetry and monitor the model, but it will not ensure the model is fair.", "hint": "Fairness: compare a metric (such as recall) across cohorts.", "note": ""}, {"n": 60, "dom": 2, "type": "mc", "stem": "You train a model by using Azure Machine Learning.\n\nThe model deployment will be invoked once a day with an input file and needs to produce an output file of predictions in a specific location in Azure Blob Storage.\n\nYou need to deploy the model.\n\nWhich solution should you use?", "opts": [["A", "online endpoint"], ["B", "batch endpoint"], ["C", "Azure Kubernetes Service (AKS)"], ["D", "conda"]], "correct": ["B"], "answer": "B. batch endpoint", "rationale": "This item tests the candidate’s knowledge of model deployment options in Azure Machine Learning. Conda is used to define environmental dependencies of a model. Azure Kubernetes Service is part of the underlying technology for an online endpoint. An online endpoint is used to support real time inference workloads. A batch endpoint can be configured to take as input a file and produce as output a file.", "hint": "Files in, files out on a schedule: batch.", "note": ""}, {"n": 61, "dom": 2, "type": "mc", "stem": "You have an Azure Machine Learning workspace that contains a registered MLflow model named Model1.\n\nA website will send individual HTTPS requests to the model and must receive predictions synchronously. The operations team must not manage Kubernetes infrastructure.\n\nYou need to choose an inference option for production.\n\nWhich option should you use?", "opts": [["A", "Batch endpoint"], ["B", "Pipeline component deployment in a batch endpoint"], ["C", "Managed online endpoint"], ["D", "Kubernetes online endpoint"]], "correct": ["C"], "answer": "C. Managed online endpoint", "rationale": "A managed online endpoint supports synchronous HTTPS inference for low-latency request/response workloads and removes the need to manage the underlying serving infrastructure. A batch endpoint is intended for asynchronous inference over large data inputs and does not meet the synchronous prediction requirement. A pipeline component deployment in a batch endpoint is for operationalizing batch inference pipelines, not website request/response scoring. A Kubernetes online endpoint can serve online inference but requires a customer-managed Kubernetes cluster, which does not meet the managed-infrastructure requirement.", "hint": "Synchronous HTTPS predictions with no cluster to manage: managed online.", "note": ""}, {"n": 62, "dom": 2, "type": "mc", "stem": "You configure an existing model and a new model as online deployments.\n\nYou plan to use the ManagedOnlineEndpoint class of the Azure Machine Learning Python SDK v2 to duplicate a percentage of invocations to both models.\n\nYou need to identify which parameter to use.\n\nWhich parameter should you use?", "opts": [["A", "traffic"], ["B", "kind"], ["C", "tags"], ["D", "mirror_traffic"]], "correct": ["D"], "answer": "D. mirror_traffic", "rationale": "", "hint": "A copy of live traffic with clients still served by the old model: mirror, not split.", "note": ""}, {"n": 63, "dom": 1, "type": "slots", "stem": "You have Azure Machine Learning workspaces for development, staging, and production.\n\nThe workspaces are deployed and updated only by using the same Bicep module and environment-specific parameter files.\n\nYou have training jobs in each workspace that download packages from an approved external package repository. The repository is referenced by DNS name and is not available through a private endpoint.\n\nYou plan to enforce a new outbound network baseline for all three workspaces.\n\nYou need to configure the Bicep module. The solution must meet the following requirements:\n\n• Prevent unrestricted internet egress from managed compute.\n• Allow training jobs to reach the approved package repository.\n• Use the existing parameter for the repository destination.\n\nHow should you complete the Bicep file? To answer, select the appropriate options in the answer area.\n\nNOTE: Each correct selection is worth one point.\n\n```bicep\nparam workspaceName string\nparam location string = resourceGroup().location\nparam approvedRepository string\n\nresource workspace 'Microsoft.MachineLearningServices/workspaces@2025-09-01' = {\n  name: workspaceName\n  location: location\n  sku: {\n    name: 'Basic'\n  }\n  properties: {\n    managedNetwork: {\n      isolationMode: [BLANK 1]\n    }\n  }\n}\n\nresource outboundRule 'Microsoft.MachineLearningServices/workspaces/outboundRules@2025-09-01' = {\n  name: 'approvedRepository'\n  parent: workspace\n  properties: {\n    category: 'UserDefined'\n    destination: approvedRepository\n    type: [BLANK 2]\n  }\n}\n```", "opts": [], "correct": [], "answer": "- isolationMode: AllowOnlyApprovedOutbound\n- type: FQDN", "rationale": "AllowOnlyApprovedOutbound prevents unrestricted internet egress and requires outbound traffic to use approved outbound rules. An outbound rule of type FQDN is appropriate because the approved package repository is referenced by DNS name and is not exposed through a private endpoint. AllowInternetOutbound would allow broader internet egress than permitted, and Disabled would not configure managed network isolation for controlled outbound access. PrivateEndpoint is not appropriate for an external repository that is not available through private endpoint connectivity, and ServiceTag is used for Azure service tags rather than a specific DNS-named package repository.", "hint": "AllowOnlyApprovedOutbound plus an FQDN rule for a public DNS name.", "note": "the platform did not show an explicit key. The correct selections come from its rationale. Dropdown choices are the ones named in the rationale. The dropdown choices were captured from the platform's explanation, so the real lists may have had more entries.", "slots": [{"label": "Blank 1 (isolationMode)", "correct": "AllowOnlyApprovedOutbound", "choices": ["AllowInternetOutbound", "AllowOnlyApprovedOutbound", "Disabled"]}, {"label": "Blank 2 (outbound rule type)", "correct": "FQDN", "choices": ["FQDN", "PrivateEndpoint", "ServiceTag"]}]}, {"n": 64, "dom": 1, "type": "mc", "stem": "A company has a team of data scientists working on an application.\n\nA data scientist tries to replicate an experiment and an error message related to the versions of libraries is displayed.\n\nYou need to recommend a solution to avoid this error in the future. The solution must minimize redundant environments.\n\nWhich solution should you recommend?", "opts": [["A", "Create and register an environment while running the first experiment. Then, specify the environment while replicating the experiment."], ["B", "Save a Dockerfile for the first experiment. Share the Dockerfile with other data scientists that need to replicate the experiment."], ["C", "Create and register an environment while running the first experiment. Then, create a duplicate environment while replicating the experiment."], ["D", "Save a requirements.txt file for the initial experiment. Then, use the file to create a new environment while replicating the experiment."]], "correct": ["A"], "answer": "A. Create and register an environment while running the first experiment. Then, specify the environment while replicating the experiment.", "rationale": "This item tests the candidate’s knowledge of best practices for replicating experiments using Azure Machine Learning experiment environments.\n\nRegistering an environment creates an environment one time and reuse it for future runs of the experiment. Passing a Dockerfile around is both error prone and creates a new environment for each experiment run. Creating and registering an environment while running the first experiment creates a redundant environment. Saving a requirements.txt file for the initial experiment will take less time than trial and error, since the correct version is specified, but is more complex since it creates redundant environments.", "hint": "Register the environment once and reference it in later runs.", "note": ""}, {"n": 65, "dom": 1, "type": "mc", "stem": "You have an Azure Machine Learning workspace named Workspace1 and a linked GitHub repository.\n\nYou plan to use a GitHub Actions workflow on GitHub-hosted runners to run Azure CLI commands against Workspace1.\n\nYou need to configure authentication for the workflow. The solution must meet the following requirements:\n\n• Avoid storing reusable Azure credentials in the repository.\n• Limit access to only the Azure resources required by the workflow.\n\nWhat should you configure?", "opts": [["A", "GitHub repository secrets for the workspace name, resource group, and location."], ["B", "A Microsoft Entra application that has a federated credential for the repository, and Azure Login configured with the client ID, tenant ID, and subscription ID."], ["C", "An Azure DevOps service connection scoped to Workspace1, and a GitHub Actions workflow that references the service connection."], ["D", "A Microsoft Entra application that has a client secret, and Azure Login configured with the AZURE_CREDENTIALS repository secret."]], "correct": ["B"], "answer": "B. A Microsoft Entra application that has a federated credential for the repository, and Azure Login configured with the client ID, tenant ID, and subscription ID.", "rationale": "A Microsoft Entra application with a federated credential allows GitHub Actions to authenticate to Azure by using OpenID Connect and short-lived tokens, and Azure Login can use the client ID, tenant ID, and subscription ID without storing a reusable client secret. A client secret stored in AZURE_CREDENTIALS is a reusable Azure credential and does not meet the repository secret constraint. An Azure DevOps service connection is not the authentication mechanism for a GitHub Actions workflow. Repository secrets that store only workspace metadata identify the target workspace but do not authenticate the workflow to Azure.", "hint": "Federated credential plus Azure Login: no reusable secret in the repo.", "note": ""}, {"n": 66, "dom": 3, "type": "mc", "stem": "You are developing a large language model (LLM)-based application by using the prompt flow SDK in a Microsoft Foundry project.\n\nYou want to use a flow to create an executable workflow that manages data flow and processing in the application. One node in the flow must represent a specific tool that provides unique capabilities. This node handles data processing, task execution, and algorithmic operations, with defined inputs and outputs.\n\nYou need to configure the node type.\n\nWhat should you do?", "opts": [["A", "Chain the nodes together to form an executable workflow."], ["B", "Configure the node to run a prompt."], ["C", "Configure the node as a tool."], ["D", "Configure the node as a chain."]], "correct": ["C"], "answer": "C. Configure the node as a tool.", "rationale": "In Microsoft Foundry prompt flow, a tool node is used to represent a functional component that performs specific operations such as data processing, API calls, or algorithm execution. Tool nodes explicitly define inputs and outputs, making them suitable for integrating unique capabilities into the flow. Chaining nodes together describes how nodes are linked, not a node type. Configuring the node as a chain is incorrect since a chain is the overall workflow, not an individual node. Configuring the node to run a prompt applies to prompt nodes, which handle LLM interactions rather than algorithmic or task execution logic. Therefore, the correct choice is to configure the node as a tool.", "hint": "A node that runs a function with defined inputs and outputs is a tool node.", "note": ""}, {"n": 67, "dom": 3, "type": "mc", "stem": "You have a Microsoft Foundry project that contains Dev, Test, and Production environments. Each environment has a Standard deployment from the same Azure OpenAI model family.\n\nTest is used to validate model updates before production release. Current release records include only the model name and application API version.\n\nYou need to make future Production releases auditable and prevent unapproved model behavior changes.\n\nWhat should you do?", "opts": [["A", "Upgrade Production when a new default model version is available, and include the current model version in the release bundle."], ["B", "Opt out of automatic model version upgrades in Production, and include the current model version in the release bundle."], ["C", "Opt out of automatic model version upgrades in Production, and include only the application API version in the release bundle."], ["D", "Upgrade Production when the current model version expires, and include only the application API version in the release bundle."]], "correct": ["B"], "answer": "B. Opt out of automatic model version upgrades in Production, and include the current model version in the release bundle.", "rationale": "Opting out of automatic model version upgrades keeps Production on the approved model version until a manual change is approved, and recording the current model version provides release traceability for audit and rollback decisions. Upgrading when a new default version is available can change Production behavior without approval. Recording only the application API version does not identify the deployed model version. Upgrading when the current model version expires delays automatic change but still allows Production to change outside a controlled promotion.", "hint": "Pin the model version and record the model version, not just the API version.", "note": ""}, {"n": 68, "dom": 3, "type": "slots", "stem": "You have a GitHub repository that stores prompt files for a Microsoft Foundry customer service agent.\n\nPrompt files contain repeated behavior guidance, and automated evaluations fail when responses vary in structure.\n\nYou need to redesign the response-generation prompt template by separating reusable behavior guidance from response-format requirements.\n\nHow should you configure the prompt template? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "opts": [], "correct": [], "answer": "- Shared behavior guidance: Role, tone, and language\n- Response format requirements: JSON, fields, and schema", "rationale": "Role, tone, and language define reusable behavior guidance that can be applied consistently across response-generation requests, while JSON, fields, and schema define deterministic response-format requirements for automated evaluation. Customer, product, and issue details are runtime context, not reusable behavior guidance or response-format requirements. Branch, reviewer, and tag information is source-control metadata and does not configure prompt behavior or response structure.", "hint": "Reusable behavior (role, tone) is separate from format requirements (JSON schema).", "note": "the platform did not show an explicit key. The correct selections come from its rationale.", "slots": [{"label": "Shared behavior guidance", "correct": "Role, tone, and language", "choices": ["Branch, reviewer, and tag", "Customer, product, and issue", "JSON, fields, and schema", "Role, tone, and language"]}, {"label": "Response format requirements", "correct": "JSON, fields, and schema", "choices": ["Branch, reviewer, and tag", "Customer, product, and issue", "JSON, fields, and schema", "Role, tone, and language"]}]}, {"n": 69, "dom": 3, "type": "mc", "stem": "You have a GitHub repository named Repo1 that stores application code, tests, and prompt files for a Microsoft Foundry agent.\n\nA developer updates a prompt file. The prompt revision must be reviewed by the team and tested before deployment.\n\nYou need to manage the prompt revision in source control.\n\nWhat should you do?", "opts": [["A", "Save the prompt change locally, publish the file to Repo1, and skip commit history."], ["B", "Deploy the prompt change from main, and record the deployment event as the prompt version."], ["C", "Create a mutable prompt alias, and update the application to use the alias instead of commits."], ["D", "Commit the prompt change to a branch, push the branch to Repo1, and open a pull request."]], "correct": ["D"], "answer": "D. Commit the prompt change to a branch, push the branch to Repo1, and open a pull request.", "rationale": "Committing the prompt change to a branch, pushing the branch, and opening a pull request tracks the prompt revision in Git and supports team review and testing before deployment. Publishing a file without commit history does not provide versioned tracking. Recording only a deployment event does not preserve the prompt iteration before release. Using a mutable alias bypasses Git commit history and does not support source-controlled review.", "hint": "Prompt change: branch, push, pull request, review.", "note": ""}, {"n": 70, "dom": 5, "type": "mc", "stem": "You have an Azure Machine Learning workspace that contains a fine-tuned model named Model1.\n\nA production application sends inference requests to a managed online endpoint named Endpoint1.\n\nEndpoint1 has a deployment named blue that uses Model1 version 3.\n\nModel1 version 4 passed validation.\n\nYou need to promote version 4 to production. The solution must meet the following requirements:\n\n• Avoid retraining the model in production.\n• Avoid changing the application endpoint.\n• Support rollback to version 3.\n\nWhat should you do?", "opts": [["A", "Replace blue in Endpoint1 with Model1 version 4, and delete the version 3 deployment."], ["B", "Add a green deployment to Endpoint1 that uses Model1 version 4, and route production traffic to green."], ["C", "Register Model1 version 4 with a production tag, and keep the current endpoint traffic settings."], ["D", "Create a new managed online endpoint for Model1 version 4, and update the application to use the new endpoint."]], "correct": ["B"], "answer": "B. Add a green deployment to Endpoint1 that uses Model1 version 4, and route production traffic to green.", "rationale": "Adding a green deployment to the existing endpoint and routing traffic to it promotes the validated model without retraining or changing the application endpoint, while the blue deployment remains available for rollback. Replacing blue and deleting the version 3 deployment removes the rollback path. Creating a new endpoint requires an application change. Adding a production tag does not update the deployed model serving traffic.", "hint": "Add a green deployment next to blue, shift traffic, keep blue for rollback.", "note": ""}, {"n": 72, "dom": 4, "type": "slots", "stem": "You have a customer-support generative AI agent that handles multi-turn chat sessions. Each trace includes a session identifier.\n\nA QA dataset contains existing conversation traces from the current version of the agent.\n\nYou need to configure quality evaluators for the dataset. The solution must score:\n\n• Logical consistency across turns\n• Grammatically correct, natural-sounding language\n\nWhich metrics should you use? To answer, drag the appropriate metrics to the correct targets. Each metric may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "opts": [], "correct": [], "answer": "- Cross-turn consistency: Coherence\n- Language quality: Fluency", "rationale": "Coherence assesses whether the conversation is logical and consistent across turns, and fluency assesses whether responses are grammatically correct and natural-sounding. Groundedness measures alignment to source context, relevance measures how well responses address the query, F1-score is typically used for overlap against expected answers, and task completion measures whether a goal was completed rather than the language quality or logical flow of the conversation.", "hint": "Coherence is logic across turns. Fluency is grammar.", "note": "the platform did not show an explicit key. The correct selections come from its rationale.", "slots": [{"label": "Cross-turn consistency", "correct": "Coherence", "choices": ["Coherence", "F1-score", "Fluency", "Groundedness", "Relevance", "Task completion"]}, {"label": "Language quality", "correct": "Fluency", "choices": ["Coherence", "F1-score", "Fluency", "Groundedness", "Relevance", "Task completion"]}]}, {"n": 73, "dom": 4, "type": "mc", "stem": "You have a prompt flow that will be used in a production workflow and deployed to a managed online endpoint with CPU compute.\n\nYou want to monitor the flow execution in production by using Application Insights.\n\nYou need to enable tracing and collect system metrics for the deployment.\n\nWhat should you do?", "opts": [["A", "Specify the app_insights_enabled: true property in the deployment YAML file."], ["B", "Configure a workspace to collect metrics from Application Insights."], ["C", "Use the flow CLI to specify the location of the tracing data."], ["D", "Enable tracing for a workspace."]], "correct": ["A"], "answer": "A. Specify the app_insights_enabled: true property in the deployment YAML file.", "rationale": "The correct approach is to set app_insights_enabled: true in the deployment YAML file, because this explicitly enables Application Insights monitoring for a prompt flow deployed to a managed online endpoint. This ensures both tracing and system metrics are collected automatically in production. Configuring a workspace to collect metrics or enabling tracing for a workspace applies to experimentation scenarios, not deployed endpoints. The flow CLI can be used to deploy flows but does not configure Application Insights integration.\n\nEnable trace and collect feedback for a flow deployment", "hint": "For a prompt flow endpoint, app_insights_enabled goes in the deployment YAML.", "note": ""}, {"n": 74, "dom": 4, "type": "slots", "stem": "You have a Microsoft Foundry agent application named Agent1 that is hosted on Azure App Service. Agent1 calls Microsoft-hosted models.\n\nAll Azure resources used by Agent1 are tagged with CostCenter and Project.\n\nYou need to implement observability for Agent1. The solution must meet the following requirements:\n\n• Detect agent execution failures and latency anomalies.\n• Provide monthly chargeback reporting for model spending by tag and resource.\n\nWhich tools should you use? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "opts": [], "correct": [], "answer": "- Agent execution telemetry: Azure Monitor Application Insights\n- Model cost chargeback: Cost Analysis in Microsoft Cost Management", "rationale": "Azure Monitor Application Insights is appropriate for agent execution telemetry because it supports tracing, logging, latency investigation, and failure analysis for production troubleshooting. Cost Analysis in Microsoft Cost Management is appropriate for monthly chargeback reporting because it can analyze Azure spending by resource and tags such as CostCenter and Project. Azure Monitor Metrics Explorer is useful for platform metrics but is not the best tool for trace-level agent failure analysis or monthly chargeback. Microsoft Foundry agent evaluators assess quality, not operational telemetry or cost reporting. Azure Policy enforces governance rules but does not provide execution telemetry or chargeback reports. The Microsoft Foundry model catalog is used to discover and deploy models, not monitor agent execution or report costs.", "hint": "Failures and latency: Application Insights. Money by tag: Cost Analysis.", "note": "the platform did not show an explicit key. The correct selections come from its rationale.", "slots": [{"label": "Agent execution telemetry", "correct": "Azure Monitor Application Insights", "choices": ["Azure Monitor Application Insights", "Azure Monitor Metrics Explorer", "Azure Policy", "Cost Analysis in Microsoft Cost Management", "Microsoft Foundry agent evaluators", "Microsoft Foundry model catalog"]}, {"label": "Model cost chargeback", "correct": "Cost Analysis in Microsoft Cost Management", "choices": ["Azure Monitor Application Insights", "Azure Monitor Metrics Explorer", "Azure Policy", "Cost Analysis in Microsoft Cost Management", "Microsoft Foundry agent evaluators", "Microsoft Foundry model catalog"]}]}, {"n": 75, "dom": 4, "type": "mc", "stem": "You have a Microsoft Foundry flow that uses a large language model (LLM). The flow is deployed to an endpoint that has tracing enabled. The flow receives input from users and generates a summary of the input.\n\nYou analyze the flow and discover that the generated output contains misspelled words and incorrect grammar.\n\nYou need to identify the root cause of the issue. The evaluation must focus on the quality of the generated text.\n\nWhat should you evaluate?", "opts": [["A", "groundedness"], ["B", "fluency"], ["C", "similarity"], ["D", "relevance"]], "correct": ["B"], "answer": "B. fluency", "rationale": "The correct metric to evaluate is fluency, which measures the linguistic quality of generated text, including grammar, spelling, and overall readability. Groundedness evaluates whether the generated text is supported by evidence from a source (important in retrieval-augmented generation scenarios). Relevance assesses how well the output addresses the user's input or task. Similarity compares the generated output against a reference output. Since the issue is specifically about misspellings and grammatical errors, the correct focus is on fluency.", "hint": "Spelling and grammar: fluency.", "note": ""}, {"n": 76, "dom": 4, "type": "slots", "stem": "You have a Microsoft Foundry project that contains a JSONL evaluation dataset. Each row contains the following fields:\n\n• user_question\n• generated_answer\n• expected_answer\n\nYou plan to run a cloud dataset evaluation against the precomputed responses. The evaluation will use the Coherence evaluator and the F1 score evaluator.\n\nYou need to map the dataset fields to the evaluator inputs.\n\nWhich field should you map to each evaluator input? To answer, drag the appropriate fields to the correct targets. Each field may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "opts": [], "correct": [], "answer": "- Application input: user_question\n- Application output: generated_answer\n- Reference answer: expected_answer", "rationale": "user_question is the application input, generated_answer is the precomputed application output, and expected_answer is the reference answer used by F1 score. sample_output_text is used when an evaluation run invokes an application or agent and captures a generated response, not when the dataset already contains precomputed responses. query and response are evaluator input names, not fields in the provided dataset.", "hint": "Map your dataset columns to the evaluator inputs: input, output, reference.", "note": "the platform did not show an explicit key. The correct selections come from its rationale.", "slots": [{"label": "Application input", "correct": "user_question", "choices": ["expected_answer", "generated_answer", "query", "response", "sample_output_text", "user_question"]}, {"label": "Application output", "correct": "generated_answer", "choices": ["expected_answer", "generated_answer", "query", "response", "sample_output_text", "user_question"]}, {"label": "Reference answer", "correct": "expected_answer", "choices": ["expected_answer", "generated_answer", "query", "response", "sample_output_text", "user_question"]}]}, {"n": 77, "dom": 2, "type": "mc", "stem": "You train a model in Azure Machine Learning. Your team does not want to manage its infrastructure.\n\nYou need to deploy the model as a scalable real-time endpoint.\n\nWhich deployment option should you use?", "opts": [["A", "managed online endpoint"], ["B", "Kubernetes online endpoint"], ["C", "batch endpoint"], ["D", "local web service"]], "correct": ["A"], "answer": "A. managed online endpoint", "rationale": "", "hint": "Real-time, scalable, no infrastructure to manage: managed online.", "note": "Answer is Claude's grading. The platform did not show its key for this question. Nov 17 run. The platform key was not shown (solution not revealed); the correct answer is Claude's grading."}, {"n": 78, "dom": 2, "
