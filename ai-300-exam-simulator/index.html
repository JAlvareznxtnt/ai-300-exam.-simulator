l, split by deployment.", "note": "Answer is Claude's grading. The platform did not show its key for this question. Nov 17 run. The platform key was not shown; the correct answer is Claude's grading (Total aggregation for counts)."}, {"n": 80, "dom": 4, "type": "slots", "stem": "You have a RAG chat application in Microsoft Foundry that answers HR policy questions. The application sends user prompts and retrieved HR policy passages to a model deployment.\n\nThe deployment currently annotates generated responses only.\n\nYou need to configure safety controls for each stage of the request flow. The solution must meet the following requirements:\n\n• Block harmful user prompts at the configured severity threshold.\n• Detect malicious instructions in retrieved passages.\n• Block harmful generated responses at the configured severity threshold.\n\nWhich safety control should you use for each stage? To answer, drag the appropriate controls to the correct targets. Each control may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content.\n\nNOTE: Each correct selection is worth one point.", "opts": [], "correct": [], "answer": "- User prompts: Prompt content filter thresholds\n- Retrieved passages: Prompt Shields indirect attack detection with document delimiters\n- Generated responses: Completion content filter thresholds", "rationale": "", "hint": "Match the control to where the text comes from: user prompt, retrieved document, response.", "note": "Answer is Claude's grading. The platform did not show its key for this question. Nov 17 run. The platform key was not shown; the correct selections are Claude's grading. The drag-and-drop options below are the ones captured.", "slots": [{"label": "User prompts", "correct": "Prompt content filter thresholds", "choices": ["Groundedness detection", "Protected material detection", "Prompt content filter thresholds", "Completion content filter thresholds", "Prompt Shields user prompt attack detection", "Prompt Shields indirect attack detection with document delimiters"]}, {"label": "Retrieved passages", "correct": "Prompt Shields indirect attack detection with document delimiters", "choices": ["Groundedness detection", "Protected material detection", "Prompt content filter thresholds", "Completion content filter thresholds", "Prompt Shields user prompt attack detection", "Prompt Shields indirect attack detection with document delimiters"]}, {"label": "Generated responses", "correct": "Completion content filter thresholds", "choices": ["Groundedness detection", "Protected material detection", "Prompt content filter thresholds", "Completion content filter thresholds", "Prompt Shields user prompt attack detection", "Prompt Shields indirect attack detection with document delimiters"]}]}, {"n": 81, "dom": 5, "type": "multi", "stem": "You have a model that you fine-tuned in Azure Machine Learning.\n\nYou need to review training and evaluation metrics for the model.\n\nWhich two options should you select from the experiment in Azure Machine Learning studio? Each correct answer presents part of the solution.", "opts": [["A", "the completed pipeline job"], ["B", "the fine-tuning component"], ["C", "the corresponding dataset"], ["D", "the registered model"]], "correct": ["A", "B"], "answer": "A and B (unverified)", "rationale": "", "hint": "Fine-tuning runs as a pipeline job; look in the job and its components for metrics.", "note": "Answer is Claude's grading. The platform did not show its key for this question. Treat this one as unverified. Nov 17 run. The platform key was not shown. The correct answer (A and B) is Claude's reasoning; the Learn docs confirm only that metrics are viewed from the completed job. Treat as unverified."}, {"n": 82, "dom": 2, "type": "mc", "stem": "You are working on a machine learning project.\n\nYou need to enable featuring engineering functionality on data received before consuming a model.\n\nWhat should you do?", "opts": [["A", "Update the run method."], ["B", "Update the init method."], ["C", "Configure the ManagedOnlineEndpoint class."], ["D", "Connect to your workspace."]], "correct": ["A"], "answer": "A. Update the run method.", "rationale": "", "hint": "Work on each request's data happens per call, not at startup.", "note": "Answer is Claude's grading. The platform did not show its key for this question. Nov 17 run. The platform key was not shown; the correct answer is Claude's grading. Wording (\"featuring engineering\") is as shown on screen."}, {"n": 83, "dom": 2, "type": "mc", "stem": "You plan to reduce the cost of training machine learning models.\n\nThe models are all trained using pipelines and expensive GPU machines.\n\nYou have the following requirements:\n\n• Use pipelines to keep the GPU machines for the model training.\n• Uphold the performance of the model training.\n\nYou need to recommend a solution to meet the requirements.\n\nWhich solution should you recommend?", "opts": [["A", "Move memory-heavy data processing components to high-memory CPU machines."], ["B", "Select less expensive GPU machines."], ["C", "Move all components to CPU machines."], ["D", "Move all components to memory optimized machines."]], "correct": ["A"], "answer": "A. Move memory-heavy data processing components to high-memory CPU machines.", "rationale": "", "hint": "Keep the GPU for training. Move memory-heavy preparation to high-memory CPUs.", "note": "Answer is Claude's grading. The platform did not show its key for this question. Nov 17 run. The platform key was not shown; the correct answer is Claude's grading."}, {"n": 84, "dom": 2, "type": "mc", "stem": "You have an Azure Machine Learning managed online endpoint named Endpoint1. The endpoint has a deployment named Deployment1 that uses a scoring script named score.py.\n\nThe deployment uses a five-second scoring request timeout.\n\nREST invocations with a new large payload return HTTP 504. Invocations with smaller payloads return HTTP 200. A local test of score.py with the large payload completes successfully in eight seconds.\n\nYou need to enable Endpoint1 to return predictions for large payloads that complete within 10 seconds. The solution must not require changes to score.py.\n\nWhich deployment setting should you modify?", "opts": [["A", "request_settings.max_concurrent_requests_per_instance"], ["B", "scale_settings.instance_count"], ["C", "request_settings.request_timeout_ms"], ["D", "probe_settings.readiness_probe.initial_delay"]], "correct": ["C"], "answer": "C. request_settings.request_timeout_ms", "rationale": "", "hint": "A 504 means the request timed out: the timeout setting is too short.", "note": "Answer is Claude's grading. The platform did not show its key for this question. Nov 17 run. The platform key was not shown; the correct answer is Claude's grading."}];
const SYN = {"normal": [{"n": 3001, "dom": 1, "type": "mc", "stem": "You have an Azure Machine Learning compute cluster that trains on data in an Azure Storage account.\n\nSecurity forbids account keys and SAS tokens. You need the training jobs to read the data.\n\nWhat should you do?", "opts": [["A", "Save the account key in the workspace Key Vault, and read it from the training script"], ["B", "Set the container's public access level to Blob, so the cluster can read it anonymously"], ["C", "Generate a SAS token that expires in one year, and register it in the datastore"], ["D", "Assign a managed identity to the cluster, and grant it Storage Blob Data Reader on the account"]], "correct": ["D"], "rationale": "A managed identity authenticates without a stored secret, and Storage Blob Data Reader gives the read access the jobs need. An account key and a SAS token are both secrets, even when kept in Key Vault or a datastore. A public container removes authentication altogether.", "hint": "No secrets + Azure resource = managed identity + a data role.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3002, "dom": 1, "type": "mc", "stem": "You register an Azure Machine Learning datastore for a blob container.\n\nThe security team requires that no secret is stored in the workspace for this datastore.\n\nWhich authentication method should you use?", "opts": [["A", "Service principal with a client secret, stored in the datastore definition"], ["B", "SAS token, stored in the datastore definition"], ["C", "Identity-based access, with no credential stored in the datastore"], ["D", "Account key, stored in the datastore definition"]], "correct": ["C"], "rationale": "Credential-less (identity-based) datastores rely on Microsoft Entra identities and Azure RBAC, so nothing secret is saved. Account keys, SAS tokens and service principal secrets are all stored credentials.", "hint": "Credential-less datastore = identity-based access, no stored secret.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3003, "dom": 1, "type": "mc", "stem": "A folder in Azure Data Lake Storage contains Parquet files. The training script must load them as a single pandas DataFrame that keeps only five columns.\n\nYou want consumers to use the data without writing any parsing code.\n\nWhich data asset should you create?", "opts": [["A", "A custom_model asset that stores the Parquet files with the model"], ["B", "An mltable asset that defines the Parquet source and a keep_columns step"], ["C", "A uri_folder asset that points to the folder, and each consumer parses the files"], ["D", "A uri_file asset that points to one Parquet file in the folder"]], "correct": ["B"], "rationale": "An mltable asset stores the loading logic (source files, column selection, other transformations) next to the data, so consumers call one load function and get a table. A uri_folder or uri_file only gives a path, and every consumer has to write the parsing code. A model asset is for models.", "hint": "Table with schema and transformations = mltable. Just a path = uri_file or uri_folder.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3004, "dom": 1, "type": "mc", "stem": "Training runs on different days produce different results, because the conda file for your Azure Machine Learning environment does not pin package versions.\n\nYou need runs to be reproducible.\n\nWhat should you do?", "opts": [["A", "Install the latest packages with pip at the start of the training script on every run"], ["B", "Install the packages manually on the compute cluster nodes before each training run"], ["C", "Pin the package versions in the conda file, and reference the registered environment by version"], ["D", "Reference the environment without a version, so the newest environment build is always picked up"]], "correct": ["C"], "rationale": "Pinned package versions in a registered, versioned environment mean every job builds the same image. Installing at job start or by hand pulls whatever is newest at that moment, and referring to the newest environment version removes the control you wanted.", "hint": "Reproducible = pinned packages + a registered environment version.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3005, "dom": 1, "type": "mc", "stem": "Your team built a data preparation component in workspace A. Teams that use workspaces B and C in other regions must reuse the same versioned component.\n\nWhat should you do?", "opts": [["A", "Give the other teams the Contributor role on workspace A, and have them run it there"], ["B", "Copy the component code into workspaces B and C, and rename it in each one"], ["C", "Email the component YAML file to the other teams, and let each team create it"], ["D", "Register the component in a registry, and reference it from workspaces B and C"]], "correct": ["D"], "rationale": "A registry is built to share assets such as components, environments and models across workspaces, and it keeps versions. Copies drift apart, and Contributor on workspace A gives far more access than reuse needs.", "hint": "Share assets across workspaces = registry.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3006, "dom": 1, "type": "multi", "stem": "You need to make an Azure Machine Learning workspace unreachable from the public internet.\n\nWhich TWO actions should you take?", "opts": [["A", "Assign a public IP address to the compute cluster"], ["B", "Create a private endpoint for the workspace in your virtual network"], ["C", "Add the corporate IP range to the workspace firewall allowlist"], ["D", "Set public network access on the workspace to Disabled"], ["E", "Enable Microsoft Defender for Cloud on the subscription"]], "correct": ["B", "D"], "rationale": "Disabling public network access closes the public endpoint, and a private endpoint gives users inside the virtual network a private path to the workspace. An IP allowlist keeps the public endpoint reachable. A public IP on compute and Defender for Cloud do not restrict workspace access.", "hint": "No public access = disable public network access + private endpoint.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3007, "dom": 1, "type": "mc", "stem": "Your team deploys Azure Machine Learning infrastructure with a Bicep file. In each pull request, a check must list which resources would be created, changed or deleted, without changing anything in Azure.\n\nWhich command should the check run?", "opts": [["A", "az deployment group validate"], ["B", "az deployment group create --mode Complete"], ["C", "az bicep build"], ["D", "az deployment group what-if"]], "correct": ["D"], "rationale": "what-if previews the changes a deployment would make and applies nothing. create deploys for real, and with Complete mode it can delete resources. bicep build only compiles to an ARM template. validate checks that the template can deploy, but it does not list the changes.", "hint": "Preview changes without deploying = what-if.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3008, "dom": 1, "type": "mc", "stem": "You review the following Bicep code:\n\n```\nresource st 'Microsoft.Storage/storageAccounts@2023-05-01' existing = {\n  name: storageName\n}\n\nresource ra 'Microsoft.Authorization/roleAssignments@2022-04-01' = {\n  scope: st\n  name: guid(st.id, principalId, roleId)\n  properties: {\n    principalId: principalId\n    roleDefinitionId: roleId\n    principalType: 'ServicePrincipal'\n  }\n}\n```\n\nWhat does this code do?", "opts": [["A", "It creates a new storage account named by storageName, and then creates a role assignment"], ["B", "It references a storage account that already exists, and scopes a role assignment to it"], ["C", "It deletes and recreates the storage account named by storageName, and then creates a role assignment"], ["D", "It creates a role assignment at subscription scope, and ignores the storage account reference"]], "correct": ["B"], "rationale": "The existing keyword tells Bicep to look up a resource that is already deployed instead of creating it. The role assignment then uses that account as its scope, so the assignment applies to that account only.", "hint": "`existing` = reference, don't create.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3009, "dom": 1, "type": "mc", "stem": "A faulty commit was pushed to the shared main branch of your ML repository, and teammates have already pulled it.\n\nYou need to undo its changes while keeping the existing history intact.\n\nWhat should you do?", "opts": [["A", "Run git revert on the commit, and push the new revert commit"], ["B", "Run git commit --amend on the faulty commit, and force-push"], ["C", "Use an interactive rebase to drop the commit, and force-push"], ["D", "Run git reset --hard HEAD~1, and force-push"]], "correct": ["A"], "rationale": "git revert adds a new commit that undoes the change, so shared history stays intact for everyone who pulled. reset, rebase and amend rewrite history, and force-pushing a rewritten main branch breaks teammates' copies.", "hint": "Undo on a shared branch = revert. Rewriting history = reset, rebase, amend.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3010, "dom": 1, "type": "mc", "stem": "Data scientists must be able to submit training jobs and register models in an Azure Machine Learning workspace.\n\nThey must not be able to create or delete compute resources or change workspace settings.\n\nWhich built-in role should you assign?", "opts": [["A", "Reader (read-only access to the workspace and its assets)"], ["B", "Owner (full access, including assigning roles to others)"], ["C", "AzureML Data Scientist (workspace actions, but no compute management)"], ["D", "Contributor (manage all resources, including compute and settings)"]], "correct": ["C"], "rationale": "AzureML Data Scientist allows nearly all workspace actions except creating or deleting compute and changing the workspace itself. Owner and Contributor allow those actions too, and Reader is read-only, so jobs could not be submitted.", "hint": "Run jobs but not manage compute = AzureML Data Scientist.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3011, "dom": 2, "type": "mc", "stem": "A training script run on a laptop calls `mlflow.log_metric(\"auc\", 0.91)`, but the metric never appears in the Azure Machine Learning workspace.\n\nYou need the metric to be logged to the workspace.\n\nWhat should you do before logging?", "opts": [["A", "Call mlflow.autolog() to log automatically to the workspace"], ["B", "Register the metric as a model asset in the workspace"], ["C", "Replace log_metric with print statements, and parse the job logs"], ["D", "Call mlflow.set_tracking_uri with the workspace's tracking URI"]], "correct": ["D"], "rationale": "Outside Azure Machine Learning compute, MLflow does not know where the workspace is, so you point it at the workspace's tracking URI. autolog turns on automatic logging but does not change where runs are stored.", "hint": "MLflow from outside Azure ML = set the tracking URI to the workspace.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3012, "dom": 2, "type": "mc", "stem": "You use automated machine learning for a binary classification model that detects fraud. Only 0.5% of the training rows are fraud.\n\nWhich primary metric is the most appropriate?", "opts": [["A", "AUC_weighted"], ["B", "accuracy"], ["C", "normalized_root_mean_squared_error"], ["D", "r2_score"]], "correct": ["A"], "rationale": "With a very small positive class, accuracy looks excellent even for a model that predicts no fraud at all. AUC_weighted still reflects how well the classes are separated. The other two are regression metrics.", "hint": "Imbalanced classes: avoid accuracy, use AUC_weighted or similar.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3013, "dom": 2, "type": "mc", "stem": "You define a sweep job. The search space samples learning_rate from a Normal distribution and batch_size from a Choice.\n\nWhich sampling algorithm can you use?", "opts": [["A", "Bayesian"], ["B", "Random"], ["C", "Median stopping"], ["D", "Grid"]], "correct": ["B"], "rationale": "Random sampling supports discrete and continuous search spaces. Grid supports only Choice, and Bayesian supports only Choice, Uniform and QUniform. Median stopping is an early termination policy, not a sampling algorithm.", "hint": "Normal/LogUniform (continuous) = random. Grid = Choice only.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3014, "dom": 2, "type": "slots", "stem": "Match each early termination policy to what it does.", "opts": [], "correct": [], "slots": [{"label": "Cancels trials whose primary metric is not within a slack factor of the best trial", "correct": "Bandit policy", "choices": ["Truncation selection policy", "Median stopping policy", "Bandit policy", "Sobol sampling"]}, {"label": "Cancels trials whose primary metric is worse than the median of the running averages of all trials", "correct": "Median stopping policy", "choices": ["Bandit policy", "Sobol sampling", "Median stopping policy", "Truncation selection policy"]}, {"label": "Cancels a fixed percentage of the lowest-performing trials at each evaluation interval", "correct": "Truncation selection policy", "choices": ["Median stopping policy", "Truncation selection policy", "Bandit policy", "Sobol sampling"]}], "rationale": "Bandit compares each trial with the best one using slack_factor or slack_amount. Median stopping compares with the median of running averages. Truncation selection drops a percentage (truncation_percentage) of the worst trials at each interval. Sobol is a sampling option, not a policy.", "hint": "Bandit = slack from best. Median = vs median. Truncation = bottom percent.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3015, "dom": 2, "type": "mc", "stem": "A sweep job must run at most 20 trials, at most 4 at the same time, and the whole sweep must stop after one hour.\n\nWhich call meets the requirements?", "opts": [["A", "sweep_job.set_limits(max_total_trials=20, max_concurrent_trials=4, timeout=3600)"], ["B", "sweep_job.set_limits(max_total_trials=4, max_concurrent_trials=20, timeout=3600)"], ["C", "sweep_job.set_limits(max_total_trials=20, max_concurrent_trials=4, timeout=60)"], ["D", "sweep_job.set_limits(max_total_trials=20, max_concurrent_trials=20, timeout=3600)"]], "correct": ["A"], "rationale": "max_total_trials caps the number of trials, max_concurrent_trials caps how many run in parallel, and timeout is in seconds for the whole sweep, so one hour is 3600. The other calls swap the two limits, use 60 seconds, or let all 20 trials run at once.", "hint": "total = how many, concurrent = at once, timeout = seconds for the whole sweep.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3016, "dom": 2, "type": "mc", "stem": "You must run a PyTorch distributed training job on 2 nodes. Each node has 4 GPUs.\n\nWhich command job settings should you use?", "opts": [["A", "instance_count=2, with distribution type PyTorch and process_count_per_instance=4"], ["B", "instance_count=2, with distribution type PyTorch and process_count_per_instance=1"], ["C", "instance_count=1, with distribution type PyTorch and process_count_per_instance=8"], ["D", "instance_count=4, with distribution type PyTorch and process_count_per_instance=2"]], "correct": ["A"], "rationale": "instance_count sets the number of nodes (2), and process_count_per_instance sets how many processes run on each node, usually one per GPU (4). The other settings give the wrong number of nodes or leave GPUs unused.", "hint": "Nodes = instance_count. Processes per node = process_count_per_instance (one per GPU).", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3017, "dom": 2, "type": "mc", "stem": "An Azure Machine Learning pipeline has a first step that downloads the latest records from an external API. When you rerun the pipeline with the same inputs, the step is skipped and the old data is used.\n\nYou need the step to run every time.\n\nWhat should you do?", "opts": [["A", "Set is_deterministic to false on the component"], ["B", "Rename the pipeline job on every run"], ["C", "Convert the step into a sweep job"], ["D", "Increase the maximum number of nodes in the compute cluster"]], "correct": ["A"], "rationale": "Pipelines reuse the output of a previous run when a component and its inputs are unchanged, because components are deterministic by default. A step that reads changing external data must declare is_deterministic false so it always runs. Cluster size, job names and sweeps do not affect reuse.", "hint": "Step reads changing external data = is_deterministic false.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3018, "dom": 2, "type": "mc", "stem": "A model was trained and logged with MLflow. You must deploy it to a managed online endpoint with the least effort.\n\nWhat should you do?", "opts": [["A", "Write a score.py file with init and run functions, and build a custom environment"], ["B", "Build a Docker image, and push it to Azure Container Registry"], ["C", "Convert the model to ONNX, and deploy it with a custom container"], ["D", "Register it as an MLflow model, and deploy it without a scoring script or a custom environment"]], "correct": ["D"], "rationale": "MLflow models support no-code deployment, so Azure Machine Learning generates the scoring logic and environment from the model metadata. The other choices add work that is not needed.", "hint": "MLflow model = no-code deployment, no score.py.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3019, "dom": 2, "type": "mc", "stem": "You need to retire version 3 of a registered model so teams stop selecting it, but you want to keep its lineage and artifacts.\n\nWhat should you do?", "opts": [["A", "Register the same artifacts again under a new model name"], ["B", "Archive the model version"], ["C", "Delete the model and its artifacts"], ["D", "Delete the storage container that holds the artifacts"]], "correct": ["B"], "rationale": "Archiving hides the version from the default listings while it remains in the workspace, so lineage is kept and the version can be restored. Deleting artifacts or their storage destroys what you wanted to keep.", "hint": "Retire but keep lineage = archive.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3020, "dom": 2, "type": "mc", "stem": "You use the Responsible AI dashboard to evaluate a loan approval model. You must compare accuracy and selection rate across groups defined by a sensitive feature.\n\nWhich component should you use?", "opts": [["A", "Counterfactual what-if"], ["B", "Fairness assessment"], ["C", "Model overview only, without defining groups"], ["D", "Data explorer"]], "correct": ["B"], "rationale": "The fairness assessment compares model performance and outcomes, such as accuracy and selection rate, across groups defined by sensitive features. Counterfactuals and the data explorer do not compare group metrics. The model overview shows overall performance unless a sensitive feature is defined.", "hint": "Compare outcomes across groups = fairness assessment.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3021, "dom": 2, "type": "mc", "stem": "Your online endpoint has a blue deployment and a green deployment that receives 20% of live traffic. The error rate of green spikes.\n\nYou need the fastest rollback without redeploying anything.\n\nWhat should you do?", "opts": [["A", "Scale green down to zero instances, and keep the 20% traffic split"], ["B", "Delete the endpoint and recreate it with only the blue deployment"], ["C", "Set the endpoint traffic to 100% for blue and 0% for green"], ["D", "Redeploy the blue model to a new deployment name, and switch clients"]], "correct": ["C"], "rationale": "The traffic split is a property of the endpoint, so setting blue to 100% immediately stops sending requests to green. Deleting the endpoint or redeploying causes downtime or delay, and scaling green to zero would make its 20% of requests fail.", "hint": "Rollback = move traffic back to the old deployment.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3022, "dom": 2, "type": "mc", "stem": "Every night, 40 million records must be scored. Nobody waits for the results, and the output is written to storage.\n\nWhich option is the most appropriate?", "opts": [["A", "A batch endpoint"], ["B", "A Kubernetes online endpoint"], ["C", "An Azure Functions timer trigger that calls an online endpoint"], ["D", "A managed online endpoint with autoscale"]], "correct": ["A"], "rationale": "Batch endpoints are built for asynchronous scoring of large datasets with outputs written to storage. Online endpoints serve low-latency requests one at a time and cost more for bulk work.", "hint": "Big asynchronous scoring = batch endpoint. Per-request low latency = online endpoint.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3023, "dom": 2, "type": "mc", "stem": "You created a model monitor for a model on a managed online endpoint, but the data drift signal shows no production data.\n\nWhat is the most likely missing configuration?", "opts": [["A", "The data drift threshold is set too high for the monitored features"], ["B", "The reference data is the validation dataset instead of the training data"], ["C", "Feature attribution drift is not turned on in the monitor settings"], ["D", "Production inference data collection is not enabled on the deployment"]], "correct": ["D"], "rationale": "Model monitoring computes signals from production inference data, so the deployment must collect it. A high threshold changes alerts, not whether data exists. The reference dataset and feature attribution drift affect other things.", "hint": "No data in the monitor = turn on inference data collection.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3024, "dom": 2, "type": "mc", "stem": "A training loop is shown below. The training loss becomes unstable and does not improve.\n\n```\nfor epoch in range(10):\n    for x, y in loader:\n        loss = loss_fn(model(x), y)\n        loss.backward()\n        optimizer.step()\n```\n\nWhat is the problem?", "opts": [["A", "optimizer.zero_grad() is never called, so gradients accumulate across batches"], ["B", "loss.backward() must be wrapped in torch.no_grad() to avoid storing activations"], ["C", "The loop must call optimizer.step() before loss.backward() on every batch"], ["D", "The optimizer must be Adam instead of SGD, because SGD cannot train this model"]], "correct": ["A"], "rationale": "PyTorch adds new gradients to the old ones, so without zero_grad each update uses the sum of all earlier batches. Changing the optimizer does not fix that, no_grad would stop gradients from being computed, and step must come after backward.", "hint": "PyTorch loop order: zero_grad, forward, backward, step.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3025, "dom": 3, "type": "mc", "stem": "An agent in a Foundry project must query an index in Azure AI Search without API keys.\n\nWhat should you do?", "opts": [["A", "Give the managed identity the Search Service Contributor role, and enable role-based access control"], ["B", "Put the search query key in the agent's app settings, and rotate it every 90 days"], ["C", "Give the project's managed identity the Search Index Data Reader role, and enable role-based access control"], ["D", "Store the search admin key in Key Vault, and have the agent read it at runtime to query the index"]], "correct": ["C"], "rationale": "Search Index Data Reader lets an identity query indexes, which is all the agent needs, and the search service must accept role-based access. Search Service Contributor manages the service but does not grant access to index data. Keys, even in Key Vault, are secrets.", "hint": "Keyless Search queries = managed identity + Search Index Data Reader.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3026, "dom": 3, "type": "mc", "stem": "A bank must process chat requests inside the EU geography. The workload is interactive, billed per token, and does not need reserved capacity.\n\nWhich deployment type should you choose?", "opts": [["A", "Global Standard, with requests routed to any region"], ["B", "Global Batch, with asynchronous processing"], ["C", "Data Zone Standard, with the EU data zone selected"], ["D", "Developer, with no service level agreement"]], "correct": ["C"], "rationale": "Data Zone Standard keeps processing inside the chosen data zone, here the EU, with pay-per-token billing. Global Standard can route requests to any region. Global Batch is asynchronous, and Developer is for testing.", "hint": "Processing must stay in a geography = Data Zone. Anywhere = Global.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3027, "dom": 3, "type": "slots", "stem": "A workload needs high, steady throughput on a provisioned throughput deployment. Put the steps in order.", "opts": [], "correct": [], "slots": [{"label": "Step 1", "correct": "Estimate the required PTUs for the workload", "choices": ["Create the provisioned deployment", "Estimate the required PTUs for the workload", "Purchase an Azure reservation for the deployed PTUs", "Verify that PTU capacity is available in the region"]}, {"label": "Step 2", "correct": "Verify that PTU capacity is available in the region", "choices": ["Verify that PTU capacity is available in the region", "Purchase an Azure reservation for the deployed PTUs", "Create the provisioned deployment", "Estimate the required PTUs for the workload"]}, {"label": "Step 3", "correct": "Create the provisioned deployment", "choices": ["Purchase an Azure reservation for the deployed PTUs", "Create the provisioned deployment", "Estimate the required PTUs for the workload", "Verify that PTU capacity is available in the region"]}, {"label": "Step 4", "correct": "Purchase an Azure reservation for the deployed PTUs", "choices": ["Estimate the required PTUs for the workload", "Create the provisioned deployment", "Verify that PTU capacity is available in the region", "Purchase an Azure reservation for the deployed PTUs"]}], "rationale": "You size first, then confirm the capacity exists, then deploy, and finally reserve the PTUs you actually run to get the discount. Reserving before you know the size or the capacity risks paying for PTUs you cannot use.", "hint": "Estimate, verify capacity, deploy, reserve.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam. The order follows the documented provisioned throughput workflow.", "syn": true}, {"n": 3028, "dom": 3, "type": "mc", "stem": "You want to use a Llama model from the Foundry model catalog. Billing must be pay-per-token, and you do not want to manage any GPU infrastructure.\n\nWhich deployment option should you use?", "opts": [["A", "A serverless API deployment"], ["B", "A managed compute deployment on dedicated GPU virtual machines"], ["C", "A provisioned throughput deployment"], ["D", "A batch endpoint"]], "correct": ["A"], "rationale": "Serverless API deployments are billed per token and need no infrastructure. Managed compute uses dedicated virtual machines billed by the hour. Provisioned throughput is for Azure OpenAI models with reserved capacity, and a batch endpoint is not meant for interactive calls.", "hint": "Pay-per-token, no GPUs = serverless API. Own dedicated GPUs = managed compute.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3029, "dom": 3, "type": "mc", "stem": "Your production app uses a Standard deployment of a chat model. Behavior must not change when Microsoft designates a new default model version, until you have tested that version.\n\nWhat should you configure?", "opts": [["A", "Set the deployment's version upgrade policy to OnceNewDefaultVersionAvailable"], ["B", "Pin the api-version in the SDK client"], ["C", "Set the deployment's version upgrade policy to NoAutoUpgrade"], ["D", "Set the deployment's version upgrade policy to OnceCurrentVersionExpired"]], "correct": ["C"], "rationale": "NoAutoUpgrade keeps the deployment on its current model version (until retirement). OnceNewDefaultVersionAvailable upgrades soon after a new default is designated, and OnceCurrentVersionExpired still upgrades at retirement. The api-version selects the API contract, not the model version.", "hint": "Freeze the model version = NoAutoUpgrade. API version is a different thing.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3030, "dom": 3, "type": "mc", "stem": "You have two variants of a system prompt. Before merging one into the main branch, you need an objective choice.\n\nWhat should you do?", "opts": [["A", "Ask two reviewers to try three questions each, and pick by feel"], ["B", "Run both variants over the same test dataset with the same evaluators, and compare the scores"], ["C", "Merge the variant that has the longer prompt, because it contains more guidance"], ["D", "Deploy both to production, and decide after a month"]], "correct": ["B"], "rationale": "Running both variants on one fixed dataset with the same evaluators gives comparable numbers before anything ships. Length is not quality, three hand-picked questions are not a sample, and a month in production is not a pre-merge check.", "hint": "Compare prompt variants = same dataset, same evaluators.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3031, "dom": 3, "type": "mc", "stem": "After an incident, the team must trace the exact prompt text that produced a bad answer in production.\n\nWhich approach supports that?", "opts": [["A", "Keep prompts as files in Git, deploy from a tagged commit, and log the commit SHA with each request"], ["B", "Store the prompt in a database row that any developer can edit, without a change log"], ["C", "Edit the prompt directly in the portal playground, and copy the final text to a wiki page"], ["D", "Keep the latest prompt text in a shared wiki page, and update it when it changes"]], "correct": ["A"], "rationale": "Prompts in Git are reviewed, versioned and reproducible, and the logged SHA ties each request to the exact text. An unversioned playground edit, a wiki and an editable row all lose history.", "hint": "Prompts are code: Git + tag + log the version.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3032, "dom": 3, "type": "mc", "stem": "A team builds agents in the Mortgage project of a shared Foundry resource. Team members must not be able to affect other projects.\n\nWhich role assignment follows least privilege?", "opts": [["A", "Owner, assigned at the Foundry resource scope"], ["B", "Foundry User, assigned at the Mortgage project scope"], ["C", "Foundry User, assigned at the subscription scope"], ["D", "Contributor, assigned at the resource group scope"]], "correct": ["B"], "rationale": "Scope limits where a role applies. Foundry User (formerly Azure AI User) at the project scope lets the team build there without touching other projects. The other choices apply wider scopes or broader roles.", "hint": "Limit blast radius with the narrowest scope that works.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3033, "dom": 3, "type": "mc", "stem": "You deploy the Agent Service with a standard setup and private networking. The agent subnet must be delegated to a resource provider.\n\nWhich delegation should you use?", "opts": [["A", "Microsoft.ContainerService/managedClusters"], ["B", "Microsoft.App/environments"], ["C", "Microsoft.CognitiveServices/accounts"], ["D", "Microsoft.Web/serverFarms"]], "correct": ["B"], "rationale": "The agent subnet is delegated to Microsoft.App/environments. The other providers are for Kubernetes, App Service plans and the Foundry resource itself.", "hint": "Agent Service subnet = delegate to Microsoft.App/environments.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3034, "dom": 3, "type": "mc", "stem": "You create a private endpoint for a Foundry resource. Which subresource (group ID) should you select?", "opts": [["A", "vault"], ["B", "account"], ["C", "searchService"], ["D", "blob"]], "correct": ["B"], "rationale": "The Foundry (Azure AI services) resource uses the account subresource. blob is for Storage, searchService is for Azure AI Search, and vault is for Key Vault.", "hint": "Private endpoint subresource must match the service: Foundry = account.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3035, "dom": 3, "type": "mc", "stem": "A developer must fine-tune a model in Foundry and also deploy the resulting model.\n\nWhich built-in role is required to deploy the fine-tuned model?", "opts": [["A", "Foundry Owner"], ["B", "Foundry User"], ["C", "Cognitive Services OpenAI User"], ["D", "Reader"]], "correct": ["A"], "rationale": "A Foundry User (formerly Azure AI User) can train (fine-tune) a model, but deploying the fine-tuned model requires the Foundry Owner role (formerly Azure AI Owner). Reader is read-only, and Cognitive Services OpenAI User is meant for calling deployed models.", "hint": "Train = Foundry User. Train and deploy = Foundry Owner.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3036, "dom": 4, "type": "mc", "stem": "You run a local evaluation with the Azure AI Evaluation SDK. The JSONL file has the columns `question`, `answer` and `docs`. The Groundedness evaluator needs `response` and `context`.\n\nWhich column mapping is correct?", "opts": [["A", "{\"response\": \"{{item.answer}}\", \"context\": \"{{item.docs}}\"}"], ["B", "{\"response\": \"${data.question}\", \"context\": \"${data.answer}\"}"], ["C", "{\"query\": \"${data.answer}\", \"response\": \"${data.docs}\"}"], ["D", "{\"response\": \"${data.answer}\", \"context\": \"${data.docs}\"}"]], "correct": ["D"], "rationale": "In the SDK's evaluate() the mapping uses the ${data.column} syntax, and each evaluator input must point at the right column: the answer is the response and the retrieved documents are the context. The {{item.column}} syntax belongs to cloud evaluations, and the other mappings feed the wrong columns.", "hint": "Local evaluate() = ${data.col}. Cloud evaluation = {{item.col}}.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3037, "dom": 4, "type": "mc", "stem": "You want to run the HateUnfairnessEvaluator, a built-in risk and safety evaluator, in the Azure AI Evaluation SDK.\n\nWhat must you provide to the evaluator?", "opts": [["A", "A ground_truth column in the dataset"], ["B", "A model_config that points to a GPT deployment"], ["C", "The azure_ai_project information and a credential"], ["D", "Only an API key for Azure AI Content Safety, with no project information"]], "correct": ["C"], "rationale": "Risk and safety evaluators run on the Foundry safety evaluation service, so you give them the Foundry project (azure_ai_project) and a credential instead of a GPT model_config. They do not need ground truth.", "hint": "Quality evaluators = model_config. Safety evaluators = azure_ai_project.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3038, "dom": 4, "type": "slots", "stem": "Match each evaluator to what it checks for an agent.", "opts": [], "correct": [], "slots": [{"label": "Whether the agent called the right tools with the right parameters", "correct": "ToolCallAccuracyEvaluator", "choices": ["IntentResolutionEvaluator", "TaskAdherenceEvaluator", "ToolCallAccuracyEvaluator", "GroundednessEvaluator"]}, {"label": "Whether the agent correctly identified and addressed what the user wanted", "correct": "IntentResolutionEvaluator", "choices": ["ToolCallAccuracyEvaluator", "IntentResolutionEvaluator", "GroundednessEvaluator", "TaskAdherenceEvaluator"]}, {"label": "Whether the agent's response follows the task and instructions it was assigned", "correct": "TaskAdherenceEvaluator", "choices": ["GroundednessEvaluator", "IntentResolutionEvaluator", "TaskAdherenceEvaluator", "ToolCallAccuracyEvaluator"]}], "rationale": "ToolCallAccuracy looks at tool selection and parameters, IntentResolution at whether the user's intent was understood and addressed, and TaskAdherence at whether the response sticks to the assigned task. Groundedness compares an answer with source context, which is not about agent behavior.", "hint": "Tool calls = ToolCallAccuracy. User goal = IntentResolution. Follows instructions = TaskAdherence.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3039, "dom": 4, "type": "mc", "stem": "You must verify that every response is 100 words or fewer. The check must be deterministic and cheap, and it must run in your automated evaluation workflow.\n\nWhat should you create?", "opts": [["A", "A code-based custom evaluator: a Python callable that returns the word count result"], ["B", "The built-in Coherence evaluator, with the 100-word limit added to its prompt"], ["C", "A prompt-based custom evaluator that asks a GPT judge to count the words"], ["D", "The built-in Fluency evaluator, with a threshold of 3 on the response"]], "correct": ["A"], "rationale": "A length rule is a plain computation, so a code-based evaluator gives the same answer every time at no model cost, and it can be passed to evaluate() with the built-in ones. An LLM judge is slower, costs tokens and can miscount, and Fluency and Coherence do not measure length.", "hint": "Rule you can compute = code-based custom evaluator. Judgment call = prompt-based.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3040, "dom": 4, "type": "mc", "stem": "An evaluation of a RAG assistant gives the following average scores on a 1 to 5 scale (a score of 3 or more passes):\n\n- Retrieval: 4.5\n- Groundedness: 4.6\n- Relevance: 2.1\n- Fluency: 4.8\n\nWhat should you do first?", "opts": [["A", "Reduce the chunk size and rebuild the search index with the new chunks"], ["B", "Add a stricter completion content filter to catch unrelated answers"], ["C", "Rewrite the generation prompt so answers address the user's question"], ["D", "Fine-tune the embedding model on the domain's query and document pairs"]], "correct": ["C"], "rationale": "Retrieval is high, so the right chunks are found. Groundedness is high, so the answers match those chunks, and fluency is high. Only Relevance fails, which means the answers do not address the question, so the problem is in the generation step. Chunking, embeddings and content filters would not fix it.", "hint": "Read the scores as a chain: retrieval, then grounding, then relevance.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3041, "dom": 4, "type": "multi", "stem": "Which TWO built-in evaluators require ground truth data?", "opts": [["A", "F1 score"], ["B", "Fluency"], ["C", "Document Retrieval"], ["D", "Groundedness"], ["E", "Relevance"]], "correct": ["A", "C"], "rationale": "F1 score compares the response with a ground-truth answer. Document Retrieval compares the retrieved documents with labeled relevant documents. Groundedness, Fluency and Relevance judge the response without labels.", "hint": "Needs labels = F1 and Document Retrieval.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3042, "dom": 4, "type": "mc", "stem": "You monitor an Azure OpenAI deployment that serves non-streaming requests. You need the overall response time, split by deployment.\n\nWhich metric should you chart?", "opts": [["A", "Processed Prompt Tokens, split by ModelDeploymentName"], ["B", "Time to Response, split by ModelDeploymentName"], ["C", "Time to Last Byte, split by ModelDeploymentName"], ["D", "Provisioned-managed Utilization, split by ModelDeploymentName"]], "correct": ["C"], "rationale": "Time to Last Byte measures the total time until the last token is returned, which is the right overall latency for non-streaming calls. Time to Response measures how soon the first response appears and is recommended for streaming. The other two are token and capacity metrics, not latency.", "hint": "Non-streaming latency = Time to Last Byte. Streaming first token = Time to Response.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3043, "dom": 5, "type": "mc", "stem": "Users report that an assistant often misses a key sentence because the document was split between two consecutive chunks.\n\nWhat should you change?", "opts": [["A", "Reduce the chunk size to one sentence, and remove the overlap"], ["B", "Switch to keyword-only search"], ["C", "Lower the model temperature"], ["D", "Increase the chunk overlap"]], "correct": ["D"], "rationale": "Overlap repeats text at the end of one chunk at the start of the next, so a sentence at a boundary appears whole in at least one chunk. Smaller chunks without overlap make boundary splits worse, and temperature or search mode do not address where text is cut.", "hint": "Facts cut at chunk boundaries = add overlap.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3044, "dom": 5, "type": "mc", "stem": "A hybrid query in Azure AI Search runs a keyword search and a vector search.\n\nHow are the two result lists combined?", "opts": [["A", "By averaging the raw keyword and vector scores"], ["B", "By returning all vector results first, followed by the keyword results"], ["C", "By using keyword results as filters on the vector results"], ["D", "With Reciprocal Rank Fusion (RRF), which merges the lists by rank position"]], "correct": ["D"], "rationale": "Keyword and vector scores are on different scales, so Azure AI Search merges the ranked lists with Reciprocal Rank Fusion, which uses rank positions rather than raw scores.", "hint": "Hybrid search merges ranked lists with RRF.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3045, "dom": 5, "type": "mc", "stem": "A RAG app sends 20 chunks to the model for every question. Many of them are unrelated, which lowers groundedness and increases token cost.\n\nWhich change should you make at the retrieval stage?", "opts": [["A", "Add more few-shot examples that show the model how to ignore irrelevant chunks"], ["B", "Increase max_tokens so the model can explain which chunks are relevant"], ["C", "Raise the minimum similarity or reranker threshold, and reduce top-k"], ["D", "Increase top-k to 50 so that the right chunk is always included in context"]], "correct": ["C"], "rationale": "Filtering by a similarity or reranker threshold and sending fewer chunks removes noise before it reaches the model. More chunks add more noise and cost, and few-shot examples or longer answers do not fix retrieval precision.", "hint": "Too much noise in context = stricter threshold, smaller top-k.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3046, "dom": 5, "type": "mc", "stem": "A medical assistant retrieves documents poorly because a general-purpose embedding model does not capture the meaning of domain abbreviations. You have labeled pairs of queries and relevant documents.\n\nWhat should you do?", "opts": [["A", "Lower the generation temperature so the model stays closer to the retrieved text"], ["B", "Increase top-k to 50 so more candidate documents reach the model"], ["C", "Switch the chat model to a larger model that understands the abbreviations better"], ["D", "Choose or fine-tune a domain embedding model, and re-embed the index and queries with it"]], "correct": ["D"], "rationale": "The weakness is in how text is turned into vectors, so the fix is a better embedding model, and the documents and queries must be embedded with the same new model. The other choices act on generation or only add noise.", "hint": "Retrieval misses domain terms = domain embedding model, and re-embed everything.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3047, "dom": 5, "type": "slots", "stem": "Which technique fits each requirement best?", "opts": [], "correct": [], "slots": [{"label": "Answers must reflect policy documents that are updated every day", "correct": "Retrieval-augmented generation", "choices": ["Supervised fine-tuning", "Prompt engineering", "Retrieval-augmented generation", "Embedding model fine-tuning"]}, {"label": "You have thousands of labeled examples and need a consistent output style and format, and the few-shot prompt has become too long", "correct": "Supervised fine-tuning", "choices": ["Retrieval-augmented generation", "Supervised fine-tuning", "Embedding model fine-tuning", "Prompt engineering"]}, {"label": "A few edge cases need a quick behavior change and you have no training data", "correct": "Prompt engineering", "choices": ["Embedding model fine-tuning", "Supervised fine-tuning", "Retrieval-augmented generation", "Prompt engineering"]}], "rationale": "RAG brings in current or private knowledge at query time. Supervised fine-tuning teaches style, tone and format from examples and can shorten prompts. Prompt engineering is the first and cheapest step for small behavior changes. Fine-tuning does not keep facts up to date.", "hint": "Facts that change = RAG. Style and format at scale = fine-tuning. Quick tweak = prompt.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3048, "dom": 5, "type": "multi", "stem": "During fine-tuning, the training loss keeps falling but the validation loss starts to rise.\n\nWhich TWO changes can reduce the overfitting?", "opts": [["A", "Increase the number of epochs"], ["B", "Reduce the number of epochs"], ["C", "Increase the learning rate multiplier"], ["D", "Reduce the learning rate multiplier"], ["E", "Remove the validation file"]], "correct": ["B", "D"], "rationale": "Falling training loss with rising validation loss is a sign of overfitting. Fewer epochs and a smaller learning rate multiplier both reduce how strongly the model fits the training data. More epochs or a larger multiplier make it worse, and removing the validation file only hides the signal.", "hint": "Overfitting = fewer epochs, lower learning rate multiplier.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3049, "dom": 5, "type": "mc", "stem": "A fine-tuning job saved checkpoints at the end of each epoch. The validation results are:\n\n- Epoch 1: validation loss 0.92\n- Epoch 2: validation loss 0.61\n- Epoch 3: validation loss 0.68\n- Epoch 4: validation loss 0.80\n\nWhich checkpoint should you deploy?", "opts": [["A", "The epoch 1 checkpoint, because it has been trained the least"], ["B", "Average the weights of the four checkpoints, and deploy the result"], ["C", "The epoch 2 checkpoint, after confirming it on held-out examples"], ["D", "The epoch 4 checkpoint, because it is the most recently saved"]], "correct": ["C"], "rationale": "Validation loss is lowest at epoch 2 and then rises, so later checkpoints overfit. The latest checkpoint is not automatically the best, so compare candidates and confirm on held-out examples. Averaging checkpoints is not a supported workflow here.", "hint": "Pick the checkpoint with the best validation result, not the latest.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}, {"n": 3050, "dom": 5, "type": "mc", "stem": "You generated 2,000 training examples for fine-tuning by prompting a stronger model.\n\nWhich practice is recommended?", "opts": [["A", "Use the same generated examples for both training and validation, to save effort"], ["B", "Add the validation examples to the training set as well, to get more training data"], ["C", "Skip validation, because a stronger model produced the examples, so they are reliable"], ["D", "Review and filter the generated examples, and keep validation data separate from training data"]], "correct": ["D"], "rationale": "Synthetic data can contain errors, so it is reviewed and filtered. Validation and test examples must stay out of the training set, otherwise the validation metrics cannot reveal overfitting.", "hint": "Synthetic data still needs review, and validation stays separate.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true}], "series": [{"id": 1, "title": "App Service calling a model deployment", "text": "You have an Azure App Service web app that calls a model deployment in a Foundry resource.\n\n**Goal.** The app must call the deployment without any stored secrets, using only the permissions needed for inference.\n\nFor each of the next three questions, read one proposed solution and decide whether it meets the goal.", "qs": [{"n": 3051, "dom": 3, "type": "mc", "stem": "**Solution:** Enable a system-assigned managed identity on the web app, and assign it the Cognitive Services OpenAI User role on the Foundry resource.\n\nDoes the solution meet the goal?", "opts": [["A", "Yes"], ["B", "No"]], "correct": ["A"], "rationale": "A managed identity means no secret is stored, and Cognitive Services OpenAI User allows calling model deployments without granting management rights, so it matches least privilege for inference.", "hint": "Managed identity + a role that only allows inference = no secret, least privilege.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true, "seriesId": 1}, {"n": 3052, "dom": 3, "type": "mc", "stem": "**Solution:** Store the API key in an App Service application setting, and mark it as a deployment slot setting.\n\nDoes the solution meet the goal?", "opts": [["A", "Yes"], ["B", "No"]], "correct": ["B"], "rationale": "An API key is a secret, and an application setting still stores it. Marking it as a slot setting only keeps it from swapping between slots.", "hint": "A key in app settings is still a stored secret.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true, "seriesId": 1}, {"n": 3053, "dom": 3, "type": "mc", "stem": "**Solution:** Enable a system-assigned managed identity on the web app, and assign it the Contributor role on the subscription.\n\nDoes the solution meet the goal?", "opts": [["A", "Yes"], ["B", "No"]], "correct": ["B"], "rationale": "The identity removes the secret, but Contributor on the whole subscription is far more than inference needs, and Contributor is a management role that does not by itself grant calling the deployment. It breaks the least-privilege requirement.", "hint": "Right identity, wrong role: broad Contributor fails least privilege.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true, "seriesId": 1}]}, {"id": 2, "title": "Cutting the cost of a hyperparameter sweep", "text": "You run a sweep job in Azure Machine Learning. It tunes `learning_rate`, a continuous value, and `batch_size`, a discrete value. The training script logs the primary metric after every epoch.\n\n**Goal.** Reduce compute cost by stopping poorly performing trials early, while still exploring the continuous range of `learning_rate`.\n\nFor each of the next three questions, read one proposed solution and decide whether it meets the goal.", "qs": [{"n": 3054, "dom": 2, "type": "mc", "stem": "**Solution:** Use random sampling with a Bandit early termination policy (slack_factor 0.1, evaluation_interval 1, delay_evaluation 5).\n\nDoes the solution meet the goal?", "opts": [["A", "Yes"], ["B", "No"]], "correct": ["A"], "rationale": "Random sampling supports continuous values, and the Bandit policy cancels trials that fall outside the slack factor of the best trial, so poor trials stop early and compute is saved.", "hint": "Random sampling + an early termination policy.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true, "seriesId": 2}, {"n": 3055, "dom": 2, "type": "mc", "stem": "**Solution:** Use grid sampling with `learning_rate` defined as a Uniform distribution, together with a Bandit early termination policy.\n\nDoes the solution meet the goal?", "opts": [["A", "Yes"], ["B", "No"]], "correct": ["B"], "rationale": "Grid sampling supports only Choice values, so it cannot sample a continuous Uniform range. The policy is fine, but the sampling choice fails the requirement to explore the continuous range.", "hint": "Grid = Choice only, so it cannot explore a continuous range.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true, "seriesId": 2}, {"n": 3056, "dom": 2, "type": "mc", "stem": "**Solution:** Use random sampling, and set max_concurrent_trials equal to max_total_trials.\n\nDoes the solution meet the goal?", "opts": [["A", "Yes"], ["B", "No"]], "correct": ["B"], "rationale": "Running all trials at once only changes parallelism. No trial is stopped early, so no compute is saved.", "hint": "Parallelism is not early termination.", "note": "Synthetic question written by Claude from the official skills outline and the docs. It is not from the real exam.", "syn": true, "seriesId": 2}]}], "cases": [{"id": 1, "title": "Fabrikam Insurance claims assistant", "text": "**Business.** Fabrikam Insurance is building a claims assistant for 2,000 adjusters. It is an agent in Microsoft Foundry that answers questions from policy documents indexed in Azure AI Search and can call one external partner API at `api.partnerco.example`.\n\n**Workloads.**\n- Adjusters chat with the agent during business hours. Usage peaks sharply at 9:00 and 14:00, and the business wants reserved capacity with predictable latency.\n- A nightly job summarizes about 50,000 claim notes. Nothing needs the results before the next morning, and the business wants the lowest cost for this job.\n\n**Security and governance.**\n- The model, the search service and the storage account must not be reachable from the public internet. Traffic to them goes through private endpoints.\n- The agent's only allowed internet destination is `api.partnerco.example`.\n- External brokers upload policy PDFs that are indexed and later passed to the model as grounding documents. The security team is worried that a PDF may contain hidden instructions aimed at the model.\n- The deployment pipeline runs in GitHub Actions. No long-lived secrets are allowed, and the risk team must approve production releases.\n\n**Quality and operations.**\n- The team has a test set of 300 questions. For each question, a reviewer labeled which policy documents are relevant.\n- The team wants to catch answers that contain claims not supported by the retrieved policy text.\n- Finance wants spend per department, and the platform team wants token counts per model deployment and traces of failed agent runs.", "qs": [{"n": 1001, "dom": 3, "type": "slots", "stem": "Which deployment type fits each workload?", "opts": [], "correct": [], "slots": [{"label": "Adjuster chat: business-hours peaks, reserved capacity and predictable latency", "correct": "Provisioned throughput", "choices": ["Global Standard", "Provisioned throughput", "Global Batch", "Developer"]}, {"label": "Nightly summarization of 50,000 claim notes: asynchronous, results by next morning, lowest cost", "correct": "Global Batch", "choices": ["Developer", "Global Batch", "Provisioned throughput", "Global Standard"]}], "rationale": "Provisioned throughput reserves model capacity (PTUs), which gives predictable latency for interactive traffic. Global Batch is asynchronous with a 24-hour target and costs about 50% less than standard, which suits a nightly job nobody waits on. Global Standard is pay-per-token with no reserved capacity, and Developer is meant for testing.", "hint": "Interactive + reserved capacity = Provisioned throughput. Asynchronous + cheapest = Global Batch.", "note": "Synthetic question written by Claude from the bank's topics. It is not from the real exam, so treat the answer as our reasoning.", "caseId": 1, "syn": true}, {"n": 1002, "dom": 3, "type": "mc", "stem": "You need to restrict the agent's outbound internet access to `api.partnerco.example` only, while the Azure resources stay reachable through private endpoints.\n\nWhat should you configure in the managed network?", "opts": [["A", "Set the isolation mode to Allow internet outbound, and add a private endpoint rule for the partner API"], ["B", "Set the isolation mode to Allow only approved outbound, and add an FQDN outbound rule for `api.partnerco.example`"], ["C", "Set the isolation mode to Allow only approved outbound, and add a service tag outbound rule for the partner API"], ["D", "Disable managed network isolation, and restrict access with a Microsoft Entra Conditional Access policy"]], "correct": ["B"], "rationale": "Allow only approved outbound blocks everything except the rules you add. A public third-party hostname is allowed with an FQDN outbound rule. A private endpoint rule is for Azure resources you own, a service tag rule is for Azure service IP ranges, and Allow internet outbound does not restrict anything. Conditional Access governs user sign-ins, not network egress.", "hint": "Allow only a specific public hostname = Approved outbound + FQDN rule. Azure PaaS resources = private endpoint rule.", "note": "Synthetic question written by Claude from the bank's topics. It is not from the real exam, so treat the answer as our reasoning.", "caseId": 1, "syn": true}, {"n": 1003, "dom": 4, "type": "mc", "stem": "The security team is worried about hidden instructions inside the uploaded policy PDFs that are passed to the model as grounding documents.\n\nWhat should you configure?", "opts": [["A", "Enable Prompt Shields user prompt attack detection on the chat input of each request"], ["B", "Turn on indirect attack detection in Prompt Shields, with the policy text marked by delimiters"], ["C", "Set the completion content filter thresholds to the strictest level for the four harm categories"], ["D", "Set the prompt content filter thresholds to the strictest level for the four harm categories"]], "correct": ["B"], "rationale": "Hidden instructions inside documents are an indirect attack. Prompt Shields indirect attack detection looks at content marked as a document, so the grounding text must be delimited. User prompt attack detection covers jailbreak attempts typed by the user. Content filter thresholds, on the prompt or the completion, rate harm categories such as hate or violence, which is a different problem.", "hint": "Attack hidden in a document = indirect attack detection + delimiters. Attack typed by the user = user prompt attack detection.", "note": "Synthetic question written by Claude from the bank's topics. It is not from the real exam, so treat the answer as our reasoning.", "caseId": 1, "syn": true}, {"n": 1004, "dom": 4, "type": "slots", "stem": "Which evaluator should the team use for each goal?", "opts": [], "correct": [], "slots": [{"label": "Measure how well the retrieved documents match the reviewers' labeled relevant documents", "correct": "Document Retrieval", "choices": ["Retrieval", "Groundedness", "Fluency", "Document Retrieval", "Relevance", "Coherence"]}, {"label": "Catch answers that contain claims not supported by the retrieved policy text", "correct": "Groundedness", "choices": ["Coherence", "Relevance", "Groundedness", "Document Retrieval", "Retrieval", "Fluency"]}], "rationale": "Document Retrieval compares retrieved documents with labeled ground truth and reports ranking metrics such as NDCG, so it needs labels. Groundedness checks the answer against the retrieved context, so it flags unsupported claims. Retrieval and Relevance are judged by an LLM without labels, and Coherence and Fluency score the writing.", "hint": "Labels for documents = Document Retrieval. Answer vs retrieved chunks = Groundedness.", "note": "Synthetic question written by Claude from the bank's topics. It is not from the real exam, so treat the answer as our reasoning.", "caseId": 1, "syn": true}, {"n": 1005, "dom": 4, "type": "slots", "stem": "Which tool gives each piece of information?", "opts": [], "correct": [], "slots": [{"label": "Traces and failures of individual agent runs", "correct": "Application Insights", "choices": ["Cost Analysis", "Activity log", "Application Insights", "Azure Monitor metrics"]}, {"label": "Processed prompt tokens per model deployment", "correct": "Azure Monitor metrics", "choices": ["Application Insights", "Azure Monitor metrics", "Activity log", "Cost Analysis"]}, {"label": "Spend per department, using resource tags", "correct": "Cost Analysis", "choices": ["Azure Monitor metrics", "Activity log", "Cost Analysis", "Application Insights"]}], "rationale": "Application Insights holds traces and failures. Token counts such as Processed Prompt Tokens are Azure Monitor metrics, and you can split them by ModelDeploymentName. Money, grouped by tag, is in Cost Analysis. The activity log records control-plane operations such as who changed a resource.", "hint": "Traces and failures = App Insights. Token counts = Azure Monitor metrics. Money by tag = Cost Analysis.", "note": "Synthetic question written by Claude from the bank's topics. It is not from the real exam, so treat the answer as our reasoning.", "caseId": 1, "syn": true}]}, {"id": 2, "title": "Northwind Retail demand forecasting", "text": "**Business.** Northwind Retail forecasts weekly demand per store with a model built and operated in Azure Machine Learning.\n\n**Training.**\n- Training data lives in Azure Data Lake Storage Gen2 and is read as an `mltable` data asset.\n- A pipeline retrains the model every week, using a hyperparameter sweep. Metrics are logged with MLflow, and the best model is registered in the workspace registry.\n- Training runs on a compute cluster that must not cost money when no jobs are running.\n\n**Servin function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  return s;
}
function md(src){
  const lines = String(src).split('\n'); let out = '', i = 0, para = [], list = [];
  const flushP=()=>{ if(para.length){ out+='<p>'+inline(para.join(' '))+'</p>'; para=[]; } };
  const flushL=()=>{ if(list.length){ out+='<ul>'+list.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ul>'; list=[]; } };
  while(i<lines.length){
    const l = lines[i];
    if(l.trim().startsWith('```')){
      flushP(); flushL(); i++; const buf=[];
      while(i<lines.length && !lines[i].trim().startsWith('```')){ buf.push(lines[i]); i++; }
      i++; out += '<pre><code>'+esc(buf.join('\n'))+'</code></pre>'; continue;
    }
    const t = l.trim();
    if(!t){ flushP(); flushL(); i++; continue; }
    const m = t.match(/^(?:[-•○]|\d+\.)\s+(.*)$/);
    if(m){ flushP(); list.push(m[1]); i++; continue; }
    flushL(); para.push(t); i++;
  }
  flushP(); flushL(); return out;
}
