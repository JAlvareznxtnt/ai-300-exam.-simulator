<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-300 Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky slim header, then a two-column setup (question bank left, synthetic practice right), one question per screen, then results. */
:root{
  color-scheme:light;
  --paper:#ffffff; --mist:#f3f6fb; --ink:#0e2238; --ink-2:#4a5d73; --line:#dbe3ee; --line-2:#b9c8dc;
  --blue:#1457b8; --blue-ink:#ffffff; --blue-soft:#e8f0fc; --navy:#0b2a55; --navy-ink:#ffffff;
  --orange:#e8730c; --orange-ink:#a84a06; --orange-soft:#fff1e3;
  --good:#14783c; --good-soft:#e6f4ec; --bad:#b3261e; --bad-soft:#fbeae8;
  --shadow:0 1px 2px rgba(14,34,56,.06),0 6px 20px rgba(14,34,56,.06);
  --font-display:"Manrope","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0b1626; --mist:#10223a; --ink:#e8f0fa; --ink-2:#a3b5ca; --line:#243a57; --line-2:#35527a;
  --blue:#6db3f2; --blue-ink:#08203b; --blue-soft:#12304f; --navy:#12305a; --navy-ink:#ffffff;
  --orange:#ffa24d; --orange-ink:#ffb674; --orange-soft:#33220f;
  --good:#5fcf8d; --good-soft:#143122; --bad:#ff8a80; --bad-soft:#3a1b19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.6;transition:background-color .25s,color .25s}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);line-height:1.15;font-weight:800}
h2{font-size:1.2rem;line-height:1.25;font-weight:700}
h3{font-size:1.02rem;line-height:1.3;font-weight:700}
p{margin:0}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.mark{width:30px;height:30px;color:var(--blue);flex:none;overflow:visible}
main{max-width:1080px;margin:0 auto;padding:28px 20px 72px}
.narrow{max-width:760px;margin:0 auto}
.lead{color:var(--ink-2);font-size:1.08rem;max-width:62ch;margin-top:10px}
.stats{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:18px 0 0}
.stats li{background:var(--mist);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.95rem;color:var(--ink-2)}
.stats b{font-family:var(--font-display);color:var(--ink);font-size:1.02rem;margin-right:4px}
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:28px;align-items:start}
@media (min-width:920px){.setup-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.panel-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px}
.panel-card>header{margin-bottom:18px}
.help{color:var(--ink-2);font-size:.97rem;margin-top:4px}
.field{padding:18px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0;padding-top:0}
.field>h2{font-size:1.05rem}
.field>.help{margin-bottom:12px}
.checks{display:grid;gap:8px}
label.check{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background-color .15s,transform .15s}
label.check:hover{border-color:var(--line-2);background:var(--mist)}
label.check:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
label.check .nm{font-weight:600}
label.check .sm{grid-column:2;color:var(--ink-2);font-size:.88rem;margin-top:-2px}
label.check .cnt{grid-column:3;grid-row:1/3;font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.9rem}
label.check input{grid-row:1/3}
input[type=checkbox],input[type=radio]{width:19px;height:19px;accent-color:var(--blue);flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:10px;border:1px solid var(--line-2);background:var(--paper);color:var(--ink);padding:9px 16px;transition:background-color .15s,border-color .15s,transform .1s,box-shadow .15s}
button:hover:not(:disabled){background:var(--mist);border-color:var(--blue)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue);box-shadow:0 2px 8px color-mix(in srgb,var(--blue) 35%,transparent)}
button.primary:hover:not(:disabled){background:var(--blue);filter:brightness(1.08)}
button.block{width:100%;padding:13px 18px;font-size:1.05rem}
button.ghost{border-color:transparent;background:transparent;color:var(--blue)}
button.ghost:hover:not(:disabled){background:var(--blue-soft);border-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input[type=number]{font:inherit;width:96px;padding:9px 10px;border:1px solid var(--line-2);border-radius:10px;background:var(--paper);color:var(--ink)}
.chipbtn{padding:7px 14px;border-radius:999px;font-weight:600}
.seg{display:grid;gap:8px}
@media (min-width:520px){.seg{grid-template-columns:1fr 1fr}}
.seg label{display:grid;grid-template-columns:auto 1fr;gap:0 10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background-color .15s}
.seg label:hover{background:var(--mist)}
.seg label:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.seg input{grid-row:1/3;align-self:center}
.seg .t{font-weight:700;font-family:var(--font-display);font-size:.98rem}
.seg .d{grid-column:2;color:var(--ink-2);font-size:.9rem;line-height:1.4}
.tag{display:inline-flex;align-items:center;background:var(--orange);color:#1a0d00;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;font-family:var(--font-display);white-space:nowrap}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--mist);border-radius:999px;padding:1px 10px;font-size:.82rem;color:var(--ink-2);white-space:nowrap}
.toggle-row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .15s,background-color .15s}
.toggle-row:hover{background:var(--mist)}
.toggle-row:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
.toggle-row .nm{font-weight:600}
.toggle-row .sm{grid-column:2;color:var(--ink-2);font-size:.88rem;line-height:1.4}
.toggle-row input{grid-row:1/3}
.toggle-row .tag{grid-column:3;grid-row:1/3}
/* synthetic column */
.syn-col{display:grid;gap:16px}
.syn-head{padding:0 4px}
.syn-head h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.3rem}
.sim{background:var(--navy);color:var(--navy-ink);border-radius:16px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sim::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--orange)}
.sim h2{color:var(--navy-ink)}
.sim p{color:color-mix(in srgb,var(--navy-ink) 82%,transparent);margin-top:6px;font-size:.98rem}
.sim ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:14px 0 18px}
.sim li{border:1px solid color-mix(in srgb,var(--navy-ink) 30%,transparent);border-radius:999px;padding:2px 12px;font-size:.88rem}
button.go{background:var(--orange);border-color:var(--orange);color:#1a0d00;font-weight:800;padding:12px 20px;font-family:var(--font-display)}
button.go:hover:not(:disabled){background:var(--orange);filter:brightness(1.08);border-color:var(--orange)}
.group{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.group>.help{margin-bottom:12px}
.picks{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line-2)}
.pick .pt{font-weight:700}
.pick .pm{color:var(--ink-2);font-size:.88rem;font-weight:400;grid-column:1}
.pick svg{grid-column:2;grid-row:1/3;color:var(--blue);transition:transform .15s}
.pick:hover svg{transform:translateX(3px)}
/* quiz */
.qhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.qcount{font-family:var(--font-display);font-weight:800;font-size:1.25rem}
.qcount span{color:var(--ink-2);font-weight:600;font-size:1rem;margin-left:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#clock{font-variant-numeric:tabular-nums;font-family:var(--font-display);font-weight:700;color:var(--ink-2)}
.bar{height:8px;background:var(--mist);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:12px 0 20px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stage{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px}
.qcard.synq{border-top:5px solid var(--orange)}
.stem{font-size:1.1rem;line-height:1.6;margin-bottom:16px;max-width:70ch}
.stem p{margin:0 0 12px}
.stem ul{margin:0 0 12px;padding-left:22px}
.stem li{margin-bottom:4px}
.instr{display:inline-block;color:var(--ink-2);font-size:.9rem;font-weight:600;margin-bottom:10px}
pre{background:var(--mist);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:var(--font-mono);font-size:.86rem;line-height:1.5;margin:0 0 12px}
code{font-family:var(--font-mono);font-size:.88em;background:var(--mist);border-radius:5px;padding:1px 5px}
pre code{background:none;padding:0}
.opts{display:grid;gap:10px;margin-bottom:16px}
.opt{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;min-width:0;transition:border-color .15s,background-color .15s,transform .15s,box-shadow .15s}
.opt:hover:not(.locked){border-color:var(--blue);transform:translateY(-1px);box-shadow:0 4px 12px rgba(14,34,56,.08)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .L{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--mist);border:1px solid var(--line-2);font-family:var(--font-display);font-weight:800;font-size:.9rem;transition:background-color .15s,color .15s,border-color .15s}
.opt .T{min-width:0;overflow-wrap:anywhere}
.opt .T p{margin:0}
.opt .mk{width:24px;text-align:center;font-weight:800;font-size:1.1rem}
.opt:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .L{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.opt.right{border-color:var(--good);background:var(--good-soft);animation:pop .35s}
.opt.right .L{background:var(--good);color:var(--paper);border-color:var(--good)}
.opt.right .mk::after{content:"\2713";color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .L{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.opt.wrong .mk::after{content:"\2715";color:var(--bad)}
.opt.locked{cursor:default}
.slots{display:grid;gap:12px;margin-bottom:16px}
.slot{display:grid;gap:6px;background:var(--mist);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.slot label{font-weight:600}
select{font:inherit;padding:10px 12px;border:1.5px solid var(--line-2);border-radius:10px;background:var(--paper);color:var(--ink);max-width:100%;transition:border-color .15s}
select:hover:not(:disabled){border-color:var(--blue)}
.slotres{margin:10px 0;padding-left:20px}
.slotres li{margin-bottom:4px}
.feedback{border:1px solid var(--line);border-left:5px solid var(--line-2);padding:14px 16px;margin:0 0 16px;border-radius:12px;background:var(--mist);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
.feedback.ok{border-left-color:var(--good)} .feedback.no{border-left-color:var(--bad)}
.feedback .verdict{font-family:var(--font-display);font-weight:800;font-size:1.05rem}
.feedback .verdict.ok{color:var(--good)} .feedback .verdict.no{color:var(--bad)}
.feedback p{margin-top:8px;max-width:68ch}
.hint{background:var(--orange-soft);border:1px solid color-mix(in srgb,var(--orange) 45%,transparent);border-radius:12px;padding:10px 14px;margin:0 0 16px;animation:rise .25s}
.note{font-size:.88rem;color:var(--ink-2);margin-top:10px}
.pill-bad{color:var(--bad);font-weight:700} .pill-good{color:var(--good);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.actions .spacer{flex:1}
.panel{background:var(--mist);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:12px;padding:12px 18px;margin-bottom:16px}
.panel summary{cursor:pointer;font-weight:600;padding:2px 0}
.panel .in{margin-top:10px;max-width:72ch}
.panel .in p{margin:0 0 10px}
.panel .in ul{margin:0 0 10px;padding-left:22px}
.quit{margin-top:14px}
/* results */
.res-top{display:grid;gap:20px;align-items:center;grid-template-columns:auto 1fr}
@media (max-width:520px){.res-top{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .trk{stroke:var(--mist);} .ring .val{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:2.1rem;font-variant-numeric:tabular-nums}
.res-top .big{font-family:var(--font-display);font-weight:800;font-size:1.6rem}
.dom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;margin:12px 0}
.dom .nm{font-weight:600}
.dom .vl{color:var(--ink-2);font-size:.92rem;font-variant-numeric:tabular-nums}
.dom .bar{margin:0;grid-column:1/-1;height:10px}
.dom .bar>i{transition:width .9s cubic-bezier(.2,.8,.2,1)}
.dom .bar>i.low{background:var(--orange)}
.section-title{margin:28px 0 12px}
details.rev{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--paper);transition:border-color .15s}
details.rev[open]{border-color:var(--line-2);box-shadow:var(--shadow)}
details.rev summary{padding:12px 14px;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
details.rev .in{padding:0 16px 16px}
details.rev .sumtxt{flex:1 1 260px;min-width:0}
.opts.rv .opt{cursor:default}
.hidden{display:none}
#theme{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:.92rem}
#theme svg{width:18px;height:18px}
@media (max-width:560px){main{padding:20px 16px 64px}.top-in{padding:10px 16px}.panel-card,.group,.sim,.qcard{padding:18px}#theme span{display:none}#theme{padding:8px 10px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.small{color:var(--ink-2);font-size:.95rem;margin:4px 0}
.hero{max-width:760px}
.res-top .small{margin-top:6px}
.res-top .big .small{font-weight:600}
.field>h2{margin-bottom:4px}
.field>h2+.seg,.field>h2+.checks{margin-top:10px}
.panel .in{max-height:46vh;overflow:auto;padding-right:6px}
.drop{border:1px solid var(--line);border-radius:14px;background:var(--paper);transition:border-color .15s,box-shadow .15s}
.drop[open]{border-color:var(--line-2)}
.drop>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;transition:background-color .15s}
.drop>summary::-webkit-details-marker{display:none}
.drop>summary:hover{background:var(--mist)}
.drop>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--ink-2);border-bottom:2.5px solid var(--ink-2);transform:rotate(45deg) translateY(-2px);margin-left:auto;margin-right:4px;flex:none;transition:transform .2s}
.drop[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.drop .dt{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.drop .dv{color:var(--ink-2);font-size:.92rem}
.drop .dbody{padding:2px 16px 16px;animation:rise .22s cubic-bezier(.2,.8,.2,1)}
.drop-sub{display:block;color:var(--ink-2);font-size:.9rem;font-weight:400}
.syn-drop{box-shadow:var(--shadow)}
.syn-drop>summary{align-items:flex-start;padding:18px 20px}
.syn-drop .dt{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1.2rem}
.syn-drop .dbody{padding:0 20px 20px;display:grid;gap:14px}
.syn-drop .group{box-shadow:none;background:var(--mist);padding:16px}
.syn-drop .pick{background:var(--paper)}
.simtog{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;margin:14px 0 14px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--navy-ink) 30%,transparent);border-radius:12px;cursor:pointer;transition:background-color .15s}
.simtog:hover{background:color-mix(in srgb,var(--navy-ink) 10%,transparent)}
.simtog input{grid-row:1/3;accent-color:var(--orange)}
.simtog .nm{font-weight:700;font-family:var(--font-display);font-size:.98rem}
.simtog .sm{grid-column:2;font-size:.86rem;opacity:.85;line-height:1.4}
.domdrop{margin-bottom:0}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand"><svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 2.5h8.2L19.5 8v12.2a1.3 1.3 0 0 1-1.3 1.3H6A1.3 1.3 0 0 1 4.7 20.2V3.8A1.3 1.3 0 0 1 6 2.5z" fill="currentColor" opacity=".14" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 2.7V8h5.3" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 12.5h8M8 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="17.5" cy="18.5" r="2.6" fill="var(--orange)"/></svg>AI-300 Practice</div><button type="button" id="theme" aria-pressed="false"></button></div></header>
<main id="app"></main>
<script>
const DATA = [{"n": 1, "dom": 2, "type": "mc", "stem": "You plan to deploy an online endpoint for price forecasting.\n\nYou need to specify the name of the endpoint, its instance type, its environment, and its code configuration.\n\nWhich class should you use?", "opts": [["A", "ManagedOnlineDeployment"], ["B", "NetworkSettings"], ["C", "OnlineEndpoint"], ["D", "Model"]], "correct": ["A"], "answer": "A. ManagedOnlineDeployment", "rationale": "This item tests the candidate’s knowledge of deploying a model to an online endpoint.\n\nTo deploy an online endpoint with the name of the endpoint, its instance type, its environment and its code configuration, among other things, the class ManagedOnlineDeployment needs to be used. The class OnlineEndpoint retrieves the online endpoint's property once deployed but does not allow it to deploy one.", "hint": "Which class holds the instance type, environment and code config, as opposed to the endpoint itself?", "note": ""}, {"n": 2, "dom": 2, "type": "multi", "stem": "A company plans to implement automated machine learning.\n\nYou need to train a model.\n\nWhich two algorithms can you use? Each correct answer presents a complete solution.", "opts": [["A", "Regression"], ["B", "Dimensionality reduction"], ["C", "Clustering"], ["D", "Classification"]], "correct": ["A", "D"], "answer": "A. Regression; D. Classification", "rationale": "This item tests the candidate’s knowledge of selecting supported categories of machine learning by Automated Machine Learning in Azure.\n\nThe regression and the classification algorithms are supported by automated machine learning. The dimensionality reduction and the clustering algorithms not supported by automated machine learning.", "hint": "AutoML works on supervised tasks, where the data already has the answer.", "note": ""}, {"n": 3, "dom": 2, "type": "mc", "stem": "You have an Azure Machine Learning project.\n\nYou change the parameters of a model to generate a comparative study.\n\nYou need to store the different versions of the model.\n\nWhat should you do?", "opts": [["A", "Deploy the trained models."], ["B", "Create child runs."], ["C", "Enable Application Insights."], ["D", "Register the model."]], "correct": ["D"], "answer": "D. Register the model.", "rationale": "This item tests the candidate’s knowledge of registering a trained model.\n\nModel registration allows storing and versioning models in a workspace. Deploying the trained models will not allow storing different versions of the model. Child runs allow grouping together related models, but not storing different versions of the model. Enabling Application Insights allows sending telemetry to monitor the model but not storing different versions of it.", "hint": "Versions live in the model registry. Think about what creates a new version.", "note": ""}, {"n": 4, "dom": 2, "type": "mc", "stem": "You have an Azure Machine Learning model named Model1 that is trained by using features from registered feature sets in a managed feature store.\n\nYou need to package the model artifact before registration. The solution must meet the following requirements:\n\n• Use the same feature list during inference that was used during training.\n• Show lineage from the registered model to the feature sets used for training.\n\nWhat should you include in the model artifact?", "opts": [["A", "A feature set specification YAML file in each feature set source folder."], ["B", "A materialization settings file in the root folder."], ["C", "A root-level feature_retrieval_spec.yaml file."], ["D", "The observation data folder used to generate the training data."]], "correct": ["C"], "answer": "C. A root-level feature_retrieval_spec.yaml file.", "rationale": "A root-level feature_retrieval_spec.yaml file is required in the model artifact so Azure Machine Learning can track lineage between the registered model and feature sets and so inference code can load the same feature list used during training. Feature set specification files define feature sets but do not package the selected training feature list with the model artifact. Observation data is used to generate training data and is not the model artifact metadata used for feature lookup at inference. Materialization settings control feature store data availability and do not define the feature list packaged with the model.", "hint": "The feature retrieval spec travels with the model artifact, in a fixed file at the root.", "note": ""}, {"n": 5, "dom": 2, "type": "mc", "stem": "A company plans to put its machine learning jobs into production with MLflow.\n\nYou need to save different versions of the models after each training.\n\nWhich method should you use?", "opts": [["A", "register_model"], ["B", "log_artifact"], ["C", "get_run"], ["D", "log_param"]], "correct": ["A"], "answer": "A. register_model", "rationale": "This item tests the candidate’s knowledge of using MLflow to register different versions of models they have trained log metrics from a job run.\n\nTo save each different version of trained models, the register_model method must be used. The get_run method returns a collection of metadata about the run. log_artifact and log_param are used to log elements of the run, but do not create a new version of the model in the model registry.", "hint": "MLflow has a call that registers a trained model so versions accumulate under one name.", "note": ""}, {"n": 6, "dom": 2, "type": "mc", "stem": "You plan to optimize a machine learning workflow by using pipelines.\n\nYou need to create a reference to the data source location to pass as data to the first component.\n\nWhich class should you use?", "opts": [["A", "Input"], ["B", "Output"], ["C", "AmlTokenConfiguration"], ["D", "MLClient"]], "correct": ["A"], "answer": "A. Input", "rationale": "This item tests the candidate’s knowledge of passing data between steps in a pipeline.\n\nThe Input class will create a reference to the data source location, the data will remain in the source location. The Output class is similar, but for the output of the components. The AmlTokenConfiguration and MLClient classes are used for other purposes.", "hint": "A pipeline needs a class that points at where the data lives and passes it to the first component.", "note": ""}, {"n": 7, "dom": 2, "type": "mc", "stem": "You have a training script named entry_script.py that will run as an experiment in an Azure Machine Learning workspace.\n\nThe script accepts the following parameters.\n\n--data-folder\n--regularization\n--max-epochs\n--output-folder\n\nYou configure the experiment by using a ScriptRunConfig object.\n\nYou need to ensure that the training script receives the input dataset and output folder as parameters.\n\nWhich parameter list should you define in the arguments property of the ScriptRunConfig object?", "opts": [["A", "`['--max-epochs', 20, '--regularization', 0.01]`"], ["B", "`['entry_script.py', '--output-folder', model.as_mount()]`"], ["C", "`['--data-folder', ds.as_mount(), '--output-folder', 'outputs/']`"], ["D", "`['--data-folder', ds.download(), '--output-folder', model.as_mount()]`"]], "correct": ["C"], "answer": "C. `['--data-folder', ds.as_mount(), '--output-folder', 'outputs/']`", "rationale": "The correct solution is to mount the dataset using ds.as_mount() and specify the outputs/ directory for results. Azure Machine Learning automatically captures files written to the outputs/ directory. ds.download() is used locally, not in remote jobs. The script name should not be included in the arguments because it is already set in ScriptRunConfig. Hyperparameters like --max-epochs and --regularization are valid parameters but are not related to passing the dataset or output folder.", "hint": "To pass a dataset to a script, mount it. Outputs go to the outputs folder.", "note": ""}, {"n": 8, "dom": 2, "type": "mc", "stem": "You deploy version1 of a model and send 100 percent of incoming requests to that endpoint. You deploy version2 of the model.\n\nYou need to allocate 10 percent of incoming requests to version2 of the model by using the online-endpoint update command.\n\nWhich command segment should you use?", "opts": [["A", "`--traffic \"version1=90, version2=10\"`"], ["B", "`--traffic \"version1=10, version=90\"`"], ["C", "`--mirror-traffic`"], ["D", "`--name`"]], "correct": ["A"], "answer": "A. `--traffic \"version1=90, version2=10\"`", "rationale": "This item tests the candidate’s knowledge of blue green deployments in Azure Machine Learning.\n\nThe code segment that includes \"version1=90, version2=10\" sends 10 percent of incoming requests to version2 and 90 percent to version1. The code segment that includes \"version1=10, version=90\" sends 90 percent of incoming requests to version2. The code segment that includes --mirror-traffic sends 100 percent of incoming requests to more than one endpoint. The code segment that includes --name renames the endpoint.", "hint": "Traffic between deployments is expressed as percentages that sum to 100.", "note": ""}, {"n": 9, "dom": 2, "type": "mc", "stem": "You are training a regression model in a notebook to predict the number of customers visiting a retail store daily.\n\nYou need to log a metric by using MLflow to track the model's performance at the end of each training epoch.\n\nWhich metric should you use?", "opts": [["A", "Recall"], ["B", "Accuracy"], ["C", "Precision"], ["D", "Root mean squared error"]], "correct": ["D"], "answer": "D. Root mean squared error", "rationale": "This item tests the candidate’s knowledge of metrics for use during notebook training. Recall, Precision, and Accuracy are classification metrics unsuitable for time series forecasting. Root mean squared error is an appropriate metric for time series forecasting.", "hint": "Which regression metric is the square root of the mean squared error?", "note": ""}, {"n": 10, "dom": 2, "type": "mc", "stem": "A company hired you to debug its Azure Machine Learning pipelines.\n\nYou need to monitor the status of the pipeline after submitting it from the authoring page.\n\nWhat should you do?", "opts": [["A", "Check the pipeline job link in the submission list."], ["B", "Monitor the status in the authoring page."], ["C", "Publish the pipeline as an endpoint."], ["D", "Refresh the authoring page."]], "correct": ["A"], "answer": "A. Check the pipeline job link in the submission list.", "rationale": "This item tests the candidate’s knowledge of monitoring pipeline runs. A submitted job will appear in the submission list, along with its status. However, the pipeline job status and results are not filled back to the authoring page. Finally, the authoring page does not include details about pipeline job status.", "hint": "After submitting from the designer, the job is tracked elsewhere, not on the authoring page.", "note": ""}, {"n": 11, "dom": 2, "type": "mc", "stem": "A company plans to industrialize its machine learning workflow.\n\nThe company implements MLflow to track the training of a classifier.\n\nYou need to log the accuracy using MLflow.\n\nWhich method should you use?", "opts": [["A", "fit"], ["B", "log_artifact"], ["C", "log_metric"], ["D", "log_param"]], "correct": ["C"], "answer": "C. log_metric", "rationale": "This item tests the candidate’s knowledge of tracking model training by using MLflow.\n\nMLflow can be used to track a number of elements in your experiment. The log_metric method should be used to log the accuracy, which is a metric. The log_param method is used for any parameters you need to log, for example the hyperparameters. The log_artifact method used for any file you need to log. The fit method is needed to train your model.", "hint": "One MLflow call logs a single named value such as accuracy.", "note": ""}, {"n": 12, "dom": 2, "type": "mc", "stem": "You have a dataset that includes features and labels for training a regression model. The labels are real numbers that represent the price of an item.\n\nYou need to use the Azure Machine Learning SDK to run an automated machine learning (automated ML) experiment that trains and tunes several different regression models. The goal is to find the best performing model and its optimal hyperparameters.\n\nWhich regression metric should you use to evaluate the models?", "opts": [["A", "Normalized Mean Absolute Error (NMAE)"], ["B", "Normalized Root Mean Squared Error (NRMSE)"], ["C", "Normalized Mean Squared Error (NMSE)"], ["D", "Spearman correlation"]], "correct": ["B"], "answer": "B. Normalized Root Mean Squared Error (NRMSE)", "rationale": "The correct metric is NRMSE, because Azure Machine Learning automated ML defaults to normalized root mean squared error when evaluating regression models. NRMSE penalizes larger errors more heavily than MAE, making it useful when predicting continuous values such as prices, where large deviations can be costly. Both NMAE and NRMSE can provide insights, but NRMSE is the standard evaluation metric for automated ML regression in Azure ML. Spearman correlation measures rank correlation and is not typically used as the primary optimization metric for regression tasks in automated ML.", "hint": "AutoML regression defaults to a normalized error metric.", "note": ""}, {"n": 13, "dom": 2, "type": "mc", "stem": "You plan to optimize the hyperparameters for a machine learning model.\n\nYou need to define the metric to evaluate the hyperparameters in a sweep job.\n\nWhich parameter should you use?", "opts": [["A", "goal"], ["B", "compute"], ["C", "primary_metric"], ["D", "sampling_algorithm"]], "correct": ["C"], "answer": "C. primary_metric", "rationale": "This item tests the candidate’s knowledge of defining the primary metric used for evaluating hyperparameter values. primary_metric is the parameter in the sweep job to define the metric by which hyperparameters need to be evaluated.\n\nHyperparameter tuning a model (v2) - Azure Machine Learning", "hint": "A sweep job needs to know which logged metric to optimize.", "note": ""}, {"n": 14, "dom": 2, "type": "mc", "stem": "You have an Azure Machine Learning workspace that contains a registered MLflow model named Model1, version 1.\n\nA training pipeline runs monthly retraining jobs. Each job writes the trained MLflow model to the job output path outputs/artifacts/paths/model/.\n\nA release pipeline selects candidate models by registered model name and version.\n\nYou need to register each monthly retrained model so that the release pipeline can identify and audit the model used for each release.\n\nWhat should you do?", "opts": [["A", "Register the job output path by using a unique model name for each run."], ["B", "Register the job output path as a new version of Model1."], ["C", "Add the run ID as a tag to version 1 of Model1."], ["D", "Create a data asset named Model1 from the job output path."]], "correct": ["B"], "answer": "B. Register the job output path as a new version of Model1.", "rationale": "Registering the job output path as a new version of Model1 preserves a single registered model name while creating a distinct version for each monthly retrained artifact, allowing the release pipeline to select and audit the exact model used for a release. Registering each run under a unique model name fragments the model lineage and prevents consistent selection by the existing model name. Adding a tag to version 1 does not register the new retrained artifact as a separate model version. Creating a data asset does not register the artifact as a deployable MLflow model asset.", "hint": "Retraining output should become a new version of the same model, not a new model.", "note": ""}, {"n": 15, "dom": 2, "type": "mc", "stem": "You plan to train and deploy a new customer segmentation model.\n\nYou need to recommend a tool to deploy the trained model without specifying an environment or a scoring script.\n\nWhich service should you use?", "opts": [["A", "MLflow"], ["B", "Azure Machine Learning Endpoint"], ["C", "Prompt Flow"], ["D", "ONNX Runtime"]], "correct": ["A"], "answer": "A. MLflow", "rationale": "MLflow models can be deployed without explicitly providing an environment definition or scoring script because MLflow packages the necessary serving artifacts.", "hint": "MLflow models deploy with no scoring script and no environment (no-code).", "note": ""}, {"n": 16, "dom": 5, "type": "mc", "stem": "You have a foundation model in Azure Machine Learning.\n\nYou have a dataset in CSV format that contains the following columns:\n\n• Document\n• Summary\n\nYou have a GPU compute cluster available.\n\nYou need to configure a fine-tuning job for the foundation model that uses the dataset and the compute cluster.\n\nFrom Model catalog, you select the foundation model.\n\nWhat should you do next?", "opts": [["A", "Select Finetune. From the Configure fine-tuning job form, select the compute cluster and task type. Upload the dataset."], ["B", "Select Register. From the Register model form, select the compute cluster and task type. Map the dataset columns to the required fields."], ["C", "Select Register. From the Register model form, upload the dataset and select the compute cluster."], ["D", "Select Finetune. From the Configure fine-tuning job form, select the compute cluster and task type. Map the dataset columns to the required fields."]], "correct": ["D"], "answer": "D. Select Finetune. From the Configure fine-tuning job form, select the compute cluster and task type. Map the dataset columns to the required fields.", "rationale": "The correct step after selecting the foundation model from the Model catalog is to choose Fine-tune. Fine-tuning jobs in Azure Machine Learning require you to configure the compute cluster, select the task type (in this case, summarization), and map dataset columns (e.g., mapping Document to input and Summary to output). Uploading the dataset is possible, but the critical configuration step is mapping columns to required fields so the fine-tuning job can train correctly. The Register option is used to register models in the workspace for deployment or reuse, not for initiating fine-tuning. Therefore, the valid workflow is to select Fine-tune, configure the compute, and map the dataset columns.", "hint": "Fine-tuning from the model catalog: pick Finetune, then match the dataset columns to the task fields.", "note": ""}, {"n": 17, "dom": 5, "type": "mc", "stem": "You have a dataset that you plan to use to fine-tune a large language model (LLM) by using Azure Databricks.\n\nYou configure a Databricks cluster and install the required OpenAI Python API library.\n\nThe dataset is in a file that contains conversation-style entries.\n\nYou validate that the size of each example in the dataset remains within the input token limit of the model that you plan to fine-tune.\n\nYou need to complete the fine-tuning process.\n\nWhat should you do next?", "opts": [["A", "Upload the file that contains the dataset to Microsoft Foundry, and then test the fine-tuned model by sending requests to it."], ["B", "Upload the file that contains the dataset to Microsoft Foundry, and then monitor the fine-tuning job."], ["C", "Test the base model by sending requests to it, and then monitor the fine-tuning job."], ["D", "Test the base model by sending requests to it, and then submit the fine-tuning job."]], "correct": ["B"], "answer": "B. Upload the file that contains the dataset to Microsoft Foundry, and then monitor the fine-tuning job.", "rationale": "The correct next step is to upload the training dataset file to Azure OpenAI and monitor the fine-tuning job, because once the dataset is prepared and validated, it must be registered with the Azure OpenAI service to start fine-tuning. Only after the fine-tuning job completes can you test the fine-tuned model with requests. Testing the base model beforehand does not complete the fine-tuning process, and testing a fine-tuned model cannot occur until the fine-tune job is finished. Therefore, uploading the dataset and monitoring the job is the required next action.", "hint": "A Databricks fine-tune starts in Foundry by uploading the dataset file first.", "note": ""}, {"n": 18, "dom": 4, "type": "mc", "stem": "You have a retrieval-augmented generation (RAG) solution that uses a chat interface.\n\nYou need to test the RAG functionality. The solution must meet the following requirements:\n\n• Validate the hybrid search capabilities of the solution.\n• Verify the accuracy of the information retrieved from the knowledge base.\n\nWhat should you ask?", "opts": [["A", "questions about the content of the uploaded documents"], ["B", "questions that have not been covered in the uploaded documents"], ["C", "questions that are unrelated to the uploaded documents"], ["D", "questions that have already been answered in previous conversations"]], "correct": ["A"], "answer": "A. questions about the content of the uploaded documents", "rationale": "The correct solution is to ask questions about the content of the uploaded documents, because RAG systems combine retrieval from a knowledge base with generative responses. By asking document-specific questions, you validate that the hybrid search correctly retrieves relevant chunks from the knowledge base and that the generated answers remain accurate. Asking unrelated questions or questions not covered in the uploaded documents would test fallback behavior rather than retrieval accuracy. Asking previously answered questions only tests conversation history, not the retrieval pipeline.", "hint": "Test a RAG solution with questions about the content it actually retrieves from.", "note": ""}, {"n": 19, "dom": 5, "type": "multi", "stem": "You have a GPU compute cluster in an Azure Machine Learning workspace and a dataset in the CSV format. The dataset contains two columns named Sentence and Label.\n\nYou plan to fine-tune a foundation model from the model catalog by using the workspace.\n\nYou need to configure the fine-tuning job.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.", "opts": [["A", "Configure a scoring script."], ["B", "Create a new pipeline."], ["C", "Register the dataset in the Machine Learning workspace."], ["D", "Select the training data and map the columns in the training data to the dataset requirements."], ["E", "Select a GPU compute cluster managed by the Machine Learning workspace."]], "correct": ["D", "E"], "answer": "D. Select the training data and map the columns in the training data to the dataset requirements.; E. Select a GPU compute cluster managed by the Machine Learning workspace.", "rationale": "The correct actions are to select a GPU compute cluster and to map the training data to the dataset requirements, because fine-tuning foundation models in Azure Machine Learning requires GPU resources for training and correctly aligning your dataset’s columns (such as Sentence for input text and Label for classification target) with the model’s expected schema. A scoring script is only needed for custom deployments, not fine-tuning. Registering the dataset is optional but not required if you directly upload or select data during the fine-tuning workflow. Pipelines are used for multi-step ML workflows but are unnecessary for a single fine-tuning job.", "hint": "In the fine-tune form you select the training data and map the columns.", "note": ""}, {"n": 20, "dom": 5, "type": "mc", "stem": "You have a retrieval-augmented generation (RAG) system that processes medical documents stored in Azure Blob Storage. The system uses Azure AI Search and Microsoft Foundry.\n\nYou plan to tune the RAG implementation.\n\nYou need to chunk the documents used by the system to improve the precision and accuracy of answers. The solution must minimize costs.\n\nWhat should you do?", "opts": [["A", "Create content-aware chunks based on the structure of the documents and exclude irrelevant content."], ["B", "Use overlapping chunks to preserve context across boundaries."], ["C", "Use windowed summarization to include summaries of previous chunks in each new chunk."], ["D", "Create fixed-size chunks."]], "correct": ["A"], "answer": "A. Create content-aware chunks based on the structure of the documents and exclude irrelevant content.", "rationale": "The correct solution is to create content-aware chunks, because RAG systems work best when documents are split along natural semantic or structural boundaries (such as sections, paragraphs, or headings), ensuring that retrieved chunks are highly relevant to a query. This improves both precision and accuracy of answers while minimizing costs, since irrelevant or noisy text (e.g., headers, footers, disclaimers) can be excluded, reducing the volume of data stored and embedded. Fixed-size chunks are easy to implement but often cut across semantic boundaries, lowering precision. Overlapping chunks can preserve context but increase token usage and storage costs. Windowed summarization further raises costs and complexity by adding summaries to each chunk. Therefore, content-aware chunking with irrelevant content excluded strikes the best balance between accuracy and cost-efficiency.", "hint": "Chunk by document structure (headings, sections), not at random sizes.", "note": ""}, {"n": 21, "dom": 3, "type": "mc", "stem": "You have a Microsoft Foundry project that uses large language models (LLMs) for summarization tasks.\n\nYou plan to compare available models by using metrics such as accuracy, fluency, cost, and throughput.\n\nYou need to decide which model is best suited for your summarization tasks.\n\nWhat should you use?", "opts": [["A", "model cards"], ["B", "Playground testing in Microsoft Foundry"], ["C", "evaluation runs"], ["D", "benchmark results"]], "correct": ["D"], "answer": "D. benchmark results", "rationale": "The correct solution is to use benchmark results, because Microsoft Foundry provides standardized comparisons of available models across key metrics such as accuracy, fluency, cost, and throughput, helping you select the best model for your summarization use case. Playground testing is useful for interactive exploration but does not provide systematic, side-by-side evaluation. Evaluation runs measure model performance on your own datasets but are intended for fine-tuning or validating flows, not broad comparison. Model cards provide important documentation about a model’s intended use and risks but do not provide quantitative metrics.", "hint": "Compare models on published benchmark results before you deploy.", "note": ""}, {"n": 22, "dom": 3, "type": "mc", "stem": "You have a Microsoft Foundry project named Project1 and an agent named Agent1. Project1 and Agent1 use Microsoft Entra ID identities.\n\nAgent1 accesses an Azure AI Search service named Search1 and an Azure Storage account named Storage1.\n\nYou need to configure access. The solution must meet the following requirements:\n\n• Use Microsoft Entra ID authentication.\n• Grant only the permissions required for each resource.\n• Preserve per-principal auditing.\n\nWhat should you configure?", "opts": [["A", "Assign User Access Administrator at the resource group scope."], ["B", "Store API keys for Search1 and Storage1 as project connections."], ["C", "Assign the required Foundry and Azure RBAC roles to the calling identity at the Foundry, Search1, and Storage1 scopes."], ["D", "Assign only the Foundry User role at the Foundry resource scope."]], "correct": ["C"], "answer": "C. Assign the required Foundry and Azure RBAC roles to the calling identity at the Foundry, Search1, and Storage1 scopes.", "rationale": "Assigning the required Foundry and Azure RBAC roles to the calling identity at the appropriate Foundry and downstream resource scopes uses Microsoft Entra ID, supports least privilege, and preserves per-principal auditing. Assigning only the Foundry User role does not grant the required downstream permissions for Search1 and Storage1. API keys do not provide granular RBAC or per-principal auditing. User Access Administrator grants permission to manage role assignments and is excessive for an identity that only needs resource access.", "hint": "Give an agent access with Foundry and Azure RBAC roles, not keys.", "note": ""}, {"n": 23, "dom": 3, "type": "mc", "stem": "You have a Microsoft Foundry product support agent that uses release notes as grounding data. The agent prompt is stored in a GitHub repository.\n\nThe agent sometimes returns product version numbers that are not in the retrieved release notes. A downstream workflow accepts only a JSON object that contains status, answer, and citations.\n\nYou need to revise the prompt. The solution must meet the following requirements:\n\n• Use retrieved release notes as the only source for product and version claims.\n• Return only the accepted JSON fields.\n• Return a deterministic response when the retrieved notes do not support an answer.\n\nWhich prompt revision should you commit?", "opts": [["A", "Cite related release notes; for unsupported answers, return `insufficient_context`, a short explanation, and related citations."], ["B", "Cite supporting release notes; for unsupported answers, return `insufficient_context`, a short explanation, and related citations."], ["C", "Cite related release notes; for unsupported answers, return `insufficient_context`, `null`, and an empty citations array."], ["D", "Cite supporting release notes; for unsupported answers, return `insufficient_context`, `null`, and an empty citations array."]], "correct": ["D"], "answer": "D. Cite supporting release notes; for unsupported answers, return `insufficient_context`, `null`, and an empty citations array.", "rationale": "Citing supporting release notes and returning insufficient_context, null, and an empty citations array for unsupported answers satisfies the grounding and downstream workflow requirements. Returning a short explanation and related citations violates the deterministic unsupported-answer contract. Citing related release notes is insufficient because related notes might not support the product or version claim.", "hint": "Grounded answers cite sources, and say so when nothing supports an answer.", "note": ""}, {"n": 24, "dom": 3, "type": "mc", "stem": "You have a pretrained generative AI model in the Microsoft Foundry model catalog.\n\nYou have a Microsoft Foundry project that has a connection to the Microsoft Foundry workspace that contains the model.\n\nYou need to deploy the model to an endpoint. The solution must meet the following requirements:\n\n• Automatically route traffic to the most available Azure region.\n• Maximize default throughput without manual provisioning.\n• Minimize setup time and complexity.\n\nWhat should you include in the solution?", "opts": [["A", "Serverless API Deployment"], ["B", "Managed Compute Deployment"], ["C", "Global Standard"], ["D", "Provisioned Deployment"]], "correct": ["C"], "answer": "C. Global Standard", "rationale": "Use Global Standard for Azure OpenAI/AI Foundry deployments when you want a serverless, multi-region endpoint that auto-routes traffic to the most available Azure region, provides high default throughput without manual capacity provisioning, and minimizes setup/ops. Managed Compute Deployment (bring-your-own compute) and Provisioned Deployment (reserved PTUs/capacity) require planning and management; Serverless API Deployment is simple but typically region-scoped, not the global, auto-routed experience described.", "hint": "Pay per token, highest quota, requests routed across regions.", "note": ""}, {"n": 25, "dom": 3, "type": "mc", "stem": "You have a Microsoft Foundry project that contains a Standard deployment of a GPT-4.1 model in the East US Azure region.\n\nThe model supports a customer support agent. The workload has predictable token usage and is forecasted for 800 requests per minute. Users report variable latency during business hours.\n\nYou need to choose a production deployment plan. The solution must meet the following requirements:\n\n• Provide dedicated capacity for the forecasted workload.\n• Meet a defined latency target.\n• Process inference traffic only in the East US Azure region.\n• Avoid purchasing a reservation before capacity is confirmed.\n\nWhat should you do?", "opts": [["A", "Estimate token volume, create a Global Standard deployment, and use pay-per-token billing."], ["B", "Estimate token volume, create a Priority deployment in East US, and use pay-per-token billing."], ["C", "Estimate the required PTUs, purchase a Regional Provisioned reservation, verify East US capacity, and then create the deployment."], ["D", "Estimate the required PTUs, verify East US capacity, create a Regional Provisioned deployment, and then purchase an Azure reservation."]], "correct": ["D"], "answer": "D. Estimate the required PTUs, verify East US capacity, create a Regional Provisioned deployment, and then purchase an Azure reservation.", "rationale": "Estimating the required PTUs, verifying East US capacity, creating a Regional Provisioned deployment, and then purchasing an Azure reservation provides dedicated capacity, supports predictable latency, keeps inference processing in the East US Azure region, and avoids committing to a reservation before capacity is confirmed. Purchasing the reservation before capacity is confirmed creates unnecessary commitment risk. A Global Standard deployment uses pay-per-token billing and can process inference traffic outside the East US Azure region. A Priority deployment can support latency-sensitive workloads, but it uses pay-per-token billing and does not provide dedicated provisioned capacity for the forecasted workload.", "hint": "PTU order: estimate, verify capacity, deploy, then reserve.", "note": ""}, {"n": 27, "dom": 3, "type": "mc", "stem": "You have an application that stores product descriptions in Azure SQL Database. The same product can have descriptions in different languages.\n\nYou plan to add a product-matching workflow that compares new descriptions to existing records before publication.\n\nYou need to select a Microsoft Foundry model for the workflow. The solution must find similar records by meaning instead of exact keyword matches.\n\nWhich model type should you select?", "opts": [["A", "Reasoning chat model"], ["B", "Image generation model"], ["C", "Speech-to-text model"], ["D", "Text embedding model"]], "correct": ["D"], "answer": "D. Text embedding model", "rationale": "A text embedding model is appropriate because embeddings represent the semantic meaning of text and can be compared to find similar records, including when wording or language differs. A reasoning chat model is used to generate or reason over natural language responses, not to create compact representations for similarity comparison. An image generation model produces images from prompts and does not compare text records. A speech-to-text model transcribes audio and does not apply to stored product descriptions.", "hint": "For semantic matching you need vectors: which model type produces them?", "note": ""}, {"n": 28, "dom": 3, "type": "mc", "stem": "You have a GitHub repository for a Microsoft Foundry customer support agent. The repository contains prompts/support-summary/system.md.\n\nA CI workflow can evaluate any prompt file by using the same dataset, model connection, and input variable named conversation.\n\nYou plan to test alternative prompt-only strategies for the support summary node.\n\nYou need to add prompt variants that can be evaluated side by side and traced in source control.\n\nWhich set of files should you commit?", "opts": [["A", "Prompt variants for development, staging, production, and rollback that each copy the current prompt."], ["B", "Prompt variants for baseline, structured, formal, and few-shot strategies that each use conversation."], ["C", "Prompt variants for structured, formal, and few-shot strategies that each use a different input variable."], ["D", "Prompt variants for GPT-4o, GPT-4o mini, temperature 0.7, and temperature 0.2 that each use conversation."]], "correct": ["B"], "answer": "B. Prompt variants for baseline, structured, formal, and few-shot strategies that each use conversation.", "rationale": "Prompt variants for baseline, structured, formal, and few-shot strategies modify only prompt content while preserving the same input variable, which allows side-by-side evaluation and source-control traceability. Variants for model names or temperature settings change runtime configuration rather than prompt-only strategy. Variants that use different input variables do not preserve the evaluator input contract. Environment or rollback copies do not test alternative prompt strategies.", "hint": "Prompt variants let you compare wordings on the same dataset.", "note": ""}, {"n": 29, "dom": 3, "type": "mc", "stem": "You have a Microsoft Foundry agent application that is deployed by using GitHub Actions.\n\nThe application connects to:\n\n• Synthetic data in development\n• Sanitized production data in test\n• Live customer data in production\n\nYou plan to support frequent development deployments and controlled production releases.\n\nYou need to configure Foundry resources and project environments for development, test, and production. The solution must meet the following requirements:\n\n• Isolate project assets, agent deployments, and connections by environment.\n• Reduce the blast radius of production misconfiguration.\n• Minimize configuration drift across environments.\n\nWhich layout should you implement?", "opts": [["A", "Use one Foundry resource for all environments, create one project per environment, and share resource-level connections and model deployments."], ["B", "Use one Foundry resource and one project for all environments, and separate environment settings by using Azure App Configuration."], ["C", "Use a separate Foundry resource and project for each environment, and create environment-specific deployments and connections by using parameterized IaC."], ["D", "Use a separate Foundry resource for production only, and create development and test projects in the production Foundry resource."]], "correct": ["C"], "answer": "C. Use a separate Foundry resource and project for each environment, and create environment-specific deployments and connections by using parameterized IaC.", "rationale": "Using a separate Foundry resource and project for each environment isolates project assets, agent deployments, and connections, and parameterized IaC helps keep the environment configuration consistent while reducing drift. Using one project for all environments does not isolate assets, deployments, or connections. Using separate projects in one shared Foundry resource improves organization but shared resource-level connections and deployments weaken environment isolation and increase production blast radius. Creating development and test projects in the production Foundry resource does not sufficiently isolate production from nonproduction misconfiguration.", "hint": "Separate Foundry resource and project per environment keeps dev, test and prod apart.", "note": ""}, {"n": 31, "dom": 3, "type": "mc", "stem": "You have a Git repository that stores the system prompt for a Microsoft Foundry agent named Agent1. The repository contains the following prompt management resources:\n\n• main, which deploys the production prompt\n• Two experiment branches, which deploy prompt variants\n• A fixed regression test set with defined scoring criteria\n\nYou need to compare the prompt variants and promote the version that meets the quality threshold. The solution must meet the following requirements:\n\n• Use repeatable evaluations.\n• Attribute score differences to prompt changes only.\n• Preserve the promoted production state in source control.\n\nWhich workflow should you use?", "opts": [["A", "Use the shared test set and scoring criteria; merge the selected experiment branch to main and create a release tag."], ["B", "Use branch-specific test sets and scoring criteria; merge both experiment branches to main and create a release tag."], ["C", "Use branch-specific test sets and scoring criteria; merge the selected experiment branch to main and create a release tag."], ["D", "Use the shared test set and scoring criteria; merge both experiment branches to main and create a release tag."]], "correct": ["A"], "answer": "A. Use the shared test set and scoring criteria; merge the selected experiment branch to main and create a release tag.", "rationale": "Using the shared test set and scoring criteria isolates prompt changes as the variable being compared, and merging the selected experiment branch to main with a release tag preserves the promoted production state in source control. Branch-specific test sets or scoring criteria make the comparisons inconsistent. Merging both experiment branches does not promote only the version that meets the quality threshold.", "hint": "Compare variants on a shared test set with the same scoring criteria, then promote.", "note": ""}, {"n": 32, "dom": 5, "type": "mc", "stem": "You have a RAG application in Microsoft Foundry that uses a vector database of equipment manuals. Document chunks and user queries are embedded by using the same Azure OpenAI embedding deployment.\n\nOffline evaluation shows low recall for queries that contain internal acronyms and part names. The chat model answers correctly when the relevant chunks are provided.\n\nYou need to improve retrieval accuracy without changing the chat model or increasing the prompt context.\n\nWhat should you do?", "opts": [["A", "Change only the query embedding model, and keep the current vector index."], ["B", "Increase the number of retrieved chunks, and keep the current embedding model."], ["C", "Evaluate a domain-specific embedding model, rebuild the vector index with the selected model, and use the same model for user queries."], ["D", "Fine-tune the chat model, and keep the current vector index and query embedding configuration."]], "correct": ["C"], "answer": "C. Evaluate a domain-specific embedding model, rebuild the vector index with the selected model, and use the same model for user queries.", "rationale": "Evaluating a domain-specific embedding model, rebuilding the vector index, and using the same model for user queries addresses the retrieval failure while preserving the chat model and prompt context. Fine-tuning the chat model does not fix low recall. Changing only the query embedding model creates a mismatch with the existing document vectors. Increasing retrieved chunks does not address the embedding issue and violates the prompt-context constraint.", "hint": "Embeddings struggle with acronyms and exact terms. Consider keyword matching or a domain embedding.", "note": ""}, {"n": 33, "dom": 5, "type": "mc", "stem": "You have a Microsoft Foundry project that contains a fine-tuned support agent.\n\nThe team needs more fine-tuning examples for rare escalation scenarios. Existing support tickets contain customer PII and provide limited scenario coverage.\n\nYou need to prepare training data that expands scenario coverage and avoids using real customer records.\n\nWhat should you do?", "opts": [["A", "Use synthetic examples only for evaluation and fine-tune the model by using the existing support tickets."], ["B", "Use the existing support tickets as training data and rely on the fine-tuning job to ignore sensitive fields."], ["C", "Generate synthetic examples for the rare scenarios, validate the generated examples, and use the approved examples for fine-tuning."], ["D", "Skip validation of generated examples and use all synthetic examples to maximize training volume."]], "correct": ["C"], "answer": "C. Generate synthetic examples for the rare scenarios, validate the generated examples, and use the approved examples for fine-tuning.", "rationale": "Generating and validating synthetic examples addresses the lack of rare-scenario coverage while avoiding real customer records. Using existing support tickets does not address the PII constraint. Using synthetic data only for evaluation does not expand the fine-tuning dataset. Skipping validation can introduce low-quality or incorrect training examples.", "hint": "When real records are off-limits, generate synthetic examples and validate them.", "note": ""}, {"n": 34, "dom": 3, "type": "mc", "stem": "You have a Microsoft Foundry account that contains an AI hub. The AI hub contains a project.\n\nYou have a dataset that contains 1,000 labeled text messages.\n\nYou plan to fine-tune a language model by using the dataset. The fine-tuned model will be used in a chatbot to provide answers in a specific format and style.\n\nYou need to select a base model from the model catalog to fine-tune. The base model must support the planned use case.\n\nWhere can you find foundation models that support the use case?", "opts": [["A", "the Llama 2 family of models"], ["B", "foundation models that you can filter by using a text classification task"], ["C", "the GPT-3.5 family of models"], ["D", "foundation models that you can filter by using a chat completion task"]], "correct": ["D"], "answer": "D. foundation models that you can filter by using a chat completion task", "rationale": "The correct solution is to select foundation models filtered by the chat completion task in the Microsoft Foundry model catalog. A chatbot requires a model capable of generating conversational responses in a specified format and style, which is enabled by models designed for chat completion tasks. Filtering by text classification would be appropriate if the use case were categorizing messages, not generating styled responses. Referring specifically to the GPT-3.5 or Llama 2 families is too narrow since multiple foundation models may support chat completion, and the catalog allows you to filter broadly by task. Therefore, filtering by the chat completion task ensures you select a suitable base model for fine-tuning a chatbot.", "hint": "Pick the base model in the catalog by filtering on the task, such as chat completion.", "note": ""}, {"n": 35, "dom": 1, "type": "mc", "stem": "You are joining a new data science team working on a natural language processing application.\n\nYou need to implement a solution that meets the following requirements:\n\n• Connect to an existing Azure Machine Learning Workspace.\n• Use the workspaces module in the MLClient class of the Azure Machine Learning Python SDK v2.\n• Use the existing workspace's name, subscription ID, and resource group.\n\nWhich method should you use?", "opts": [["A", "begin_delete()"], ["B", "get()"], ["C", "begin_create()"], ["D", "list()"]], "correct": ["B"], "answer": "B. get()", "rationale": "The get() method returns a specific workspace by name, subscription, and resource group. begin_delete() deletes a workspace, begin_create() creates one, and list() returns available workspaces rather than a specific workspace.", "hint": "Connect to an existing workspace with get, not create.", "note": ""}, {"n": 36, "dom": 1, "type": "multi", "stem": "You have a repository that contains a Bicep file named main.bicep.\n\nThe file defines an Azure Machine Learning workspace and its supporting resources, including a storage account, a key vault, and an Application Insights resource.\n\nYou deploy the infrastructure to separate development, staging, and production resource groups. Each environment uses different resource names and SKUs.\n\nYou need to configure a repeatable Azure CLI deployment process. The solution must meet the following requirements:\n\n• Use the same Bicep file for all environments.\n• Use environment-specific values without editing main.bicep.\n• Preview production changes before deployment.\n\nWhich two actions should you perform? Each correct answer presents part of the solution.", "opts": [["A", "Deploy the workspace by using az ml workspace create."], ["B", "Create a Bicep parameters file for each environment."], ["C", "Preview the production deployment by using az ml workspace show."], ["D", "Create a separate Bicep file for each environment."], ["E", "Preview the production deployment by using az deployment group what-if."], ["F", "Deploy the Bicep file by using az deployment group create."]], "correct": ["B", "E"], "answer": "B. Create a Bicep parameters file for each environment.; E. Preview the production deployment by using az deployment group what-if.", "rationale": "Environment-specific parameter files allow the same Bicep template to be reused across environments. az deployment group what-if previews changes before deployment. Separate Bicep files increase drift. az ml workspace create and az ml workspace show do not provide the required deployment-template functionality.", "hint": "Same Bicep file, one parameters file per environment, preview with what-if.", "note": ""}, {"n": 37, "dom": 1, "type": "mc", "stem": "You are working on an Azure Machine Learning project.\n\nYou have the following requirements:\n\n• You need to create a reference to the data in its storage, with a copy of its metadata.\n• No data should be copied.\n\nWhat should you do?", "opts": [["A", "Register the datastore where your data is located."], ["B", "Create a dataset."], ["C", "Create a pipeline to transfer the metadata only."], ["D", "Use Azure Data Factory to ingest the data."]], "correct": ["B"], "answer": "B. Create a dataset.", "rationale": "Creating a dataset creates a reference to the data and stores metadata without copying the data itself. Registering a datastore only defines a connection to storage. Pipelines and Azure Data Factory are used for data movement and processing rather than creating metadata-backed references.", "hint": "Reference data without copying and keep metadata: that is a data asset, not a copy.", "note": ""}, {"n": 38, "dom": 1, "type": "mc", "stem": "Your company starts a new Azure Machine Learning project.\n\nThe source data is stored in Parquet files, in a hierarchical fashion to allow partitioning.\n\nYou need to create a new datastore.\n\nWhich class should you use?", "opts": [["A", "AzureBlobDatastore"], ["B", "AzureDataLakeGen2Datastore"], ["C", "KubernetesCompute"], ["D", "Spark"]], "correct": ["B"], "answer": "B. AzureDataLakeGen2Datastore", "rationale": "Azure Data Lake Gen2 supports hierarchical namespaces and partitioned Parquet data structures. AzureBlobDatastore can store Parquet files but does not provide the hierarchical namespace capability required by the scenario. KubernetesCompute and Spark are not datastore types.", "hint": "Hierarchical Parquet data: the Data Lake Gen2 datastore type.", "note": ""}, {"n": 39, "dom": 2, "type": "mc", "stem": "You have been tasked to train a machine learning model using Azure Machine Learning.\n\nCoding is not required.\n\nYou need to select the development approach to train the best-performing classification model.\n\nWhich development approach should you use?", "opts": [["A", "Azure Machine Learning Designer Pipelines"], ["B", "Azure CLI"], ["C", "VS Code extensions for Azure ML"], ["D", "Azure AutoML"]], "correct": ["D"], "answer": "D. Azure AutoML", "rationale": "Azure AutoML automatically evaluates multiple algorithms and configurations to identify the best-performing classification model with minimal coding effort. The other options provide development or orchestration tooling but do not automatically search for the optimal classification model.", "hint": "No-code search for the best classification model: automated ML.", "note": ""}, {"n": 40, "dom": 3, "type": "mc", "stem": "You have a Microsoft Foundry project that uses a large language model (LLM) deployed as an endpoint. The endpoint is part of a prompt flow for a chat application.\n\nYou need the LLM to generate responses in a specific tone of voice that aligns with your company's brand. The solution must minimize effort and costs.\n\nWhat should you do?", "opts": [["A", "Use a parameterized prompt template."], ["B", "Add a user prompt."], ["C", "Add a system message."], ["D", "Fine-tune the LLM."]], "correct": ["C"], "answer": "C. Add a system message.", "rationale": "A system message provides high-level instructions that consistently control tone, style, and behavior across interactions. It is cheaper and faster than fine-tuning and more effective for enforcing brand voice than modifying user prompts.", "hint": "A system message sets tone of voice cheaply.", "note": ""}, {"n": 41, "dom": 2, "type": "mc", "stem": "You are optimizing hyperparameters by using Azure Machine Learning.\n\nYou have the following requirements:\n\n• Use a large search space of parameters for a model.\n• Find optimal parameters quickly.\n• Minimize run time.\n\nWhich sampling strategy should you use?", "opts": [["A", "GridParameterSampling"], ["B", "BanditPolicy"], ["C", "RandomParameterSampling"], ["D", "TruncationSelectionPolicy"]], "correct": ["C"], "answer": "C. RandomParameterSampling", "rationale": "RandomParameterSampling efficiently explores large search spaces by sampling parameter combinations instead of exhaustively evaluating every possible combination like GridParameterSampling. BanditPolicy and TruncationSelectionPolicy are early termination policies, not sampling strategies.", "hint": "A very large search space: random sampling covers it without trying everything.", "note": ""}, {"n": 42, "dom": 2, "type": "mc", "stem": "You plan to optimize the hyperparameters for a machine learning model.\n\nYou need to terminate the hyperparameter tuning early when the target metric is at least 35% worse than the best-performing one in ratio.\n\nWhich early termination configuration policy should you use?", "opts": [["A", "`early_termination_policy = BanditPolicy(slack_amount=0.35, evaluation_interval=1, delay_evaluation=5)`"], ["B", "`early_termination_policy = BanditPolicy(evaluation_interval=1, delay_evaluation=5)`"], ["C", "`early_termination_policy = MedianStoppingPolicy(evaluation_interval=1, delay_evaluation=5)`"], ["D", "`early_termination_policy = TruncationSelectionPolicy(truncation_percentage=10, evaluation_interval=1, delay_evaluation=5)`"]], "correct": ["A"], "answer": "A. `early_termination_policy = BanditPolicy(slack_amount=0.35, evaluation_interval=1, delay_evaluation=5)`", "rationale": "To stop runs whose metric is at least 35% worse than the current best in ratio terms, use BanditPolicy with a slack amount of 0.35. Other policies use different stopping criteria and do not directly represent the required threshold comparison.", "hint": "Bandit stops trials that fall behind the best by a margin (slack).", "note": ""}, {"n": 43, "dom": 1, "type": "mc", "stem": "You plan to create a custom component for a machine learning model training pipeline by using Azure ML Python SDK v2.\n\nYou need to define the values for the required components in the custom component's YAML file to execute the custom component's script.\n\nWhich components will you select?", "opts": [["A", "metadata of the component"], ["B", "metadata of the component and inputs"], ["C", "metadata of the component, inputs, outputs, and compute environment"], ["D", "metadata of the component, inputs, and compute environment"]], "correct": ["C"], "answer": "C. metadata of the component, inputs, outputs, and compute environment", "rationale": "To execute a custom component script, the component YAML must include component metadata, inputs, outputs, and the execution environment.", "hint": "A component YAML defines metadata, inputs, outputs and the command or environment.", "note": ""}, {"n": 44, "dom": 2, "type": "mc", "stem": "You are working on a machine learning project to predict a person's height based on their weight given in pounds.\n\nYou plan to implement Machine Learning Operations (MLOps) practices by triggering the machine learning model training pipeline to retrain the model if the weight is in kilograms.\n\nYou need to recommend an event type to listen to that will be used to trigger the pipeline.\n\nWhich event type should you recommend?", "opts": [["A", "Microsoft.MachineLearningServices.DatasetDriftDetected"], ["B", "Microsoft.MachineLearningServices.RunStatusChanged"], ["C", "Microsoft.MachineLearningServices.RunCompleted"], ["D", "Microsoft.MachineLearningServices.ModelDeployed"]], "correct": ["A"], "answer": "A. Microsoft.MachineLearningServices.DatasetDriftDetected", "rationale": "A change from pounds to kilograms represents data drift. DatasetDriftDetected events are used to trigger retraining workflows when the input data distribution changes.", "hint": "Drift detection raises a specific event type you can subscribe to for retraining.", "note": ""}, {"n": 45, "dom": 2, "type": "multi", "stem": "You have an Azure Machine Learning workspace that contains a registered classification model named Model1.\n\nVersion 2 of Model1 is deployed to production. Version 3 has a higher AUC than version 2.\n\nYou plan to promote version 3 after a Change Advisory Board review.\n\nYou need to prepare compliance evidence for version 3. The solution must meet the following requirements:\n\n• Assess fairness across age groups, high-error cohorts, and explainability.\n• Provide information that can be shared with technical and non-technical reviewers.\n\nWhich two actions should you perform?", "opts": [["A", "Compare the accuracy and AUC metrics for versions 2 and 3."], ["B", "Configure Azure Monitor alerts for the production endpoint."], ["C", "Create an online deployment for version 3 without routing traffic to it."], ["D", "Create a Responsible AI dashboard for version 3."], ["E", "Generate a Responsible AI scorecard for version 3."]], "correct": ["D", "E"], "answer": "D. Create a Responsible AI dashboard for version 3.; E. Generate a Responsible AI scorecard for version 3.", "rationale": "The Responsible AI dashboard provides fairness, error analysis, and explainability insights. The Responsible AI scorecard provides a shareable governance artifact suitable for both technical and business stakeholders.", "hint": "Compliance evidence: Responsible AI dashboard plus the scorecard as a shareable artifact.", "note": ""}, {"n": 47, "dom": 1, "type": "mc", "stem": "You are working on an Azure Machine Learning project.\n\nYou must reuse the same Python packages, environment variables, and software settings across all compute instances.\n\nYou need to configure the project.\n\nWhat should you do?", "opts": [["A", "Use the Workspace object."], ["B", "Apply the script to set up the environment for all compute instances."], ["C", "Use the Environment object."], ["D", "Use the same compute instance for all scripts."]], "correct": ["C"], "answer": "C. Use the Environment object.", "rationale": "This item tests the candidate’s knowledge of configuring run settings for a script.\n\nUsing the Environment object will guarantee you are reusing the same environment every time. Using the Workspace object will allow you to create a workspace but not to save the environment. Applying the script to set up your environment will not guarantee the environment is the same every time because it is not a systematic approach. Using the same compute instance will not allow you to reuse the environment across all compute instances.", "hint": "Reuse packages and settings: the Environment object, registered once.", "note": ""}, {"n": 48, "dom": 1, "type": "slots", "stem": "You have a GitHub repository that contains Azure Machine Learning infrastructure as Bicep files in the infra folder.\n\nThe repository has a protected environment named prod that requires reviewer approval. The Azure authentication values are stored as prod environment secrets. A Microsoft Entra application has a federated credential for GitHub Actions.\n\nYou need to complete a workflow that deploys from the main branch only when files in the infra folder change. The solution must meet the following requirements:\n\n- Use OpenID
